name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL \
            "https://github.com/golangci/golangci-lint/releases/download/v1.64.8/golangci-lint-1.64.8-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin \
              --strip-components=1 \
              "golangci-lint-1.64.8-linux-amd64/golangci-lint"

      # The Autonomat contract (spec check) lives in a private repository.
      # With the SPEC_READ_TOKEN secret (a token that can read
      # dotdevlabs/autonomat and dotdevlabs/ctlkit) the check is strict.
      # Without it the check is skipped explicitly and loudly; it still runs
      # strictly wherever a token is available (locally, release).
      - name: Configure private access
        env:
          SPEC_READ_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
        run: |
          if [ -n "$SPEC_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPEC_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "GITHUB_TOKEN=$SPEC_READ_TOKEN" >> "$GITHUB_ENV"
          else
            echo "::warning::SPEC_READ_TOKEN is not configured; skipping the live spec drift check"
            echo "AUTONOMATCTL_ALLOW_SPEC_SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Run CI gate
        run: bin/ci
