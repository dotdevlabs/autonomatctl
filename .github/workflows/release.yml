name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ctlkit lives in a private repository.
      - name: Git access to private modules
        run: git config --global url."https://x-access-token:${SPEC_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          SPEC_READ_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}

      - name: Check contract release version
        env:
          CGO_ENABLED: '0'
          GOPRIVATE: github.com/dotdevlabs/*
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/autonomatctl ./cmd/autonomatctl
          go run ./cmd/check-release "$GITHUB_REF_NAME" /tmp/autonomatctl
          echo 'RELEASE_NOTICE<<NOTICE_EOF' >> "$GITHUB_ENV"
          cat docs/release-notice.md >> "$GITHUB_ENV"
          echo 'NOTICE_EOF' >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPRIVATE: github.com/dotdevlabs/*
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
