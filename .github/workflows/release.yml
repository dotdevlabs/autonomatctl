name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-publication
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ctlkit lives in a private repository.
      - name: Git access to private modules
        run: git config --global url."https://x-access-token:${SPEC_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          SPEC_READ_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}

      - name: Validate and tag exact release
        id: version
        run: |
          go run ./cmd/releaseversion --base HEAD^1 check
          version=$(cat VERSION)
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$tag" HEAD
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$version" = 0.0.1 ]; then
            echo 'args=release --clean --release-notes docs/releases/v0.0.1.md' >> "$GITHUB_OUTPUT"
          else
            echo 'args=release --clean' >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.8.2
          args: ${{ steps.version.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPRIVATE: github.com/dotdevlabs/*
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.version.outputs.tag == 'v0.0.1' && 'v0.1.9' || '' }}
