version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: autonomatctl
    main: ./cmd/autonomatctl
    binary: autonomatctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/dotdevlabs/ctlkit/pkg/version.Version={{.Version}}
        -X github.com/dotdevlabs/ctlkit/pkg/version.Commit={{.Commit}}
        -X github.com/dotdevlabs/ctlkit/pkg/version.Date={{.Date}}

archives:
  - id: autonomatctl
    ids:
      - autonomatctl
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: dotdevlabs
    name: autonomatctl

brews:
  - name: autonomatctl
    repository:
      owner: dotdevlabs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: dotdevlabs-bot
      email: bot@dotdevlabs.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: https://github.com/dotdevlabs/autonomatctl
    description: "CLI for Autonomat, generated from its OpenAPI contract"
    install: bin.install "autonomatctl"
    test: |
      system "#{bin}/autonomatctl version"
