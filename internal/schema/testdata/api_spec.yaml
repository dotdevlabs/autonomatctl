        - id: initiative_dispatch_paused
          status: 409
          auth: apiToken
          params:
            run_id: "~fixture:executions:run_initiative_paused_queued"
        - id: dependencies_open
          status: 409
          auth: apiToken
          prepare: openDependency
          params:
            run_id: "~fixture:executions:run_for_execution_queued"
        - id: credential_not_usable
          status: 422
          auth: apiToken
          prepare: rejectedDefaultCredential
          params:
            run_id: "~fixture:executions:run_for_execution"
      responses:
        "200":
          description: Run execution payload
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/RunExecutionDocument"
        "401":
          description: >-
            Unauthorized. An expired run token is answered with the title "Credential not accepted. run token expired."
            so the agent knows to refresh (`POST /runs/{run_id}/token`) before expiry. The payload's `api_token` is
            issued once per execution attempt: fetching the payload again returns the same token while it is valid.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "404":
          description: Not found
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "409":
          description: >-
            Dispatch blocked: an active pause or stop control, a paused initiative (automatic dispatch paused), or
            work items the item depends on (`depends_on_ids`) that are not yet done or closed. The reason is in
            `errors[0].title`; for dependencies it lists the items waited on.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: >-
            Run cannot be dispatched (unusable credential, budget or policy), or the node context of a schedule run
            could not be built (the execution is then failed with the error as its reason).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /runs/{run_id}/token:
    post:
      summary: Refresh the run token of a run
      operationId: refreshRunToken
      description: >-
        Revokes the run's current token and issues a new one with a fresh lifetime (the role's `run_timeout` plus a fixed margin), returned as `api_token`
        (`token`, `expires_at`). Authenticated by the run's own token while it is still valid, or by an account
        token. An expired token is a 401 ("run token expired"); fetch the payload again to obtain a new token.
        A terminal run gets no token (409). A run token of another run is a 403. Needs no capability grant.
      security:
        - apiToken: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      x-scenarios:
        - id: refreshed_with_run_token
          status: 200
          auth: runToken
          params:
            run_id: "~fixture:executions:run_api_root"
        - id: refreshed_with_account_token
          status: 200
          auth: apiToken
          params:
            run_id: "~fixture:executions:run_for_execution"
        - id: unauthorized
          status: 401
          auth: none
          params:
            run_id: "~fixture:executions:run_api_root"
        - id: expired_run_token
          status: 401
          auth: expiredRunToken
          params:
            run_id: "~fixture:executions:run_api_root"
        - id: other_runs_token
          status: 403
          auth: runToken
          params:
            run_id: "~fixture:executions:run_api_ungranted"
        - id: not_found
          status: 404
          auth: apiToken
          params:
            run_id: "0"
        - id: terminal_run
          status: 409
          auth: apiToken
          params:
            run_id: "~fixture:executions:run_two"
        - id: malformed_body
          status: 422
          auth: apiToken
          raw_body: "{not json"
          params:
            run_id: "~fixture:executions:run_for_execution"
      responses:
        "200":
          description: Fresh run token
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/RunTokenDocument"
        "401":
          description: Unauthorized, or the run token has expired ("Credential not accepted. run token expired.")
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "403":
          description: The run token belongs to another run
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "404":
          description: Run not found
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "409":
          description: The run is terminal; no token is issued
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: The request body is not a valid JSON:API document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
