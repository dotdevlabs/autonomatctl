  /products/{product_id}/sunset:
    post:
      summary: Sunset a product (operator action; there is no way back). Moves it through the lifecycle machine to sunset and archives it in the same transaction; the response returns once the product itself is sunset. After that transaction commits, a background job closes the product's records, one record per job, and it archives its open work items and completes pending Inbox items in the account whose origin is the product or whose work item belongs to it, including already closed work. Each item receives a system resolution with the product name and sunset date, unless it also belongs to an initiative closed by this sunset, in which case it receives the initiative closure reason. Before closing work, it archives refinements that are neither complete nor archived, preventing further follow-through or verification from starting. It removes all active initiative memberships while retaining their history. Each affected draft or active initiative with no remaining active product is archived to `abandoned`; its open work is archived and pending account Inbox items originating from the initiative or linked to any of its work, including already closed work, receive a system resolution stating that the initiative closed because its products were sunset. Initiatives with another active product and already terminal initiatives retain their state and work. Records and history are preserved. Archived work starts no new executions; running executions are left to finish.
      operationId: sunsetProduct
      security:
        - apiToken: []
      parameters:
        - name: product_id
          in: path
          required: true
          description: Record id or key.
          schema:
            type: string
      responses:
        "200":
          description: The product, now sunset and archived
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ProductResourceDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "404":
          description: Product not found
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: The product is already sunset
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /inbox_items:
    get:
      summary: List Inbox items
      operationId: listInboxItems
      security:
        - apiToken: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Filter query supporting typed qualifiers and free text. Example: `status:open category:approval owner:approval product:my-product initiative:my-initiative since:2026-10-01 sort:updated-desc`. Status is derived from the latest transition and is open, answered, applied, withdrawn or recovery_failed.
            Unknown qualifiers and invalid values return 422.
            A reference filter such as `product:` accepts the record's id (as in API resources) or its key, e.g. `product:424` or `product:my-product`.
            An unknown value returns 422 with `source.parameter` `q` and a `detail` naming the filter, the value and that an id or key is expected.
          x-qualifiers:
            - key: status
              type: enum
              values: ["open","answered","applied","withdrawn","recovery_failed"]
              description: "One of the listed values; several values separated by commas match any of them, `-status:` negates."
            - key: category
              type: enum
              values: ["decision","approval","access","information","review","attestation","external_action"]
              description: "One of the listed values; several values separated by commas match any of them, `-category:` negates."
            - key: owner
              type: enum
              values: ["approval","operator"]
              description: "One of the listed values; several values separated by commas match any of them, `-owner:` negates."
            - key: product
              type: reference
              description: "The record id (as in API resources) or its key; `-product:` negates."
            - key: initiative
              type: reference
              description: "The record id (as in API resources) or its key; `-initiative:` negates."
            - key: since
              type: date
              description: "A date (YYYY-MM-DD) on updated_at, with >=, >, <=, < or a range `from..to`."
            - key: until
              type: date
              description: "A date (YYYY-MM-DD) on updated_at, with >=, >, <=, < or a range `from..to`."
            - key: sort
              type: sort
              values: ["created-asc","created-desc","updated-asc","updated-desc"]
              description: "The sort order, `<field>-asc` or `<field>-desc` (ascending when no direction is given)."
          schema:
            type: string
        - name: "page[number]"
          in: query
          required: false
          description: Page number, starting at 1 (default 1).
          schema:
            type: integer
            minimum: 1
        - name: "page[size]"
