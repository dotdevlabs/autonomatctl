          type: string
          enum: [executions]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/ExecutionShowAttributes"
        links:
          $ref: "#/components/schemas/ResourceLinks"
    ExecutionShowDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ExecutionShowResource"
        meta:
          type: object
          additionalProperties: false
          description: The run's actions in id order.
          properties:
            actions:
              type: array
              items:
                $ref: "#/components/schemas/ExecutionActionSummary"
    RunResultDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id, attributes]
          properties:
            type:
              type: string
              enum: [run-results]
            id:
              type: string
            attributes:
              type: object
              additionalProperties: false
              required: [state, finished_at]
              properties:
                state:
                  type: string
                finished_at:
                  type: string
                  format: date-time
                  nullable: true
    RunTokenDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id, attributes]
          properties:
            type:
              type: string
              enum: [run-tokens]
            id:
              type: string
            attributes:
              type: object
              additionalProperties: false
              required: [api_token]
              properties:
                api_token:
                  type: object
                  additionalProperties: false
                  required: [token, expires_at]
                  properties:
                    token:
                      type: string
                    expires_at:
                      type: string
    RunExecutionDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id, attributes]
          properties:
            type:
              type: string
              enum: [runs]
            id:
              type: string
            attributes:
              $ref: "#/components/schemas/RunExecutionAttributes"
    RunExecutionAttributes:
      oneOf:
        - $ref: "#/components/schemas/CredentialCheckAttributes"
        - $ref: "#/components/schemas/NormalRunExecutionAttributes"
    NormalRunExecutionAttributes:
      type: object
      additionalProperties: false
      required: [account, item, assignment, callback]
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationPayload"
        account:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        item:
          type: object
          additionalProperties: false
          required: [id, type, title, status]
          description: >-
            A schedule run has `item.type` set to `schedule` and an opaque `item.id` of the form
            `schedule:{schedule_id}:{schedule_occurrence}`. The occurrence may contain colons.
            No work item exists for this ID, so no work-item request applies. Use the procedure,
            node context and prior results in `assignment.goal` and report results using `data.id`.
          properties:
            id:
              type: string
              description: >-
                For a schedule run, an opaque occurrence identifier of the form
                `schedule:{schedule_id}:{schedule_occurrence}`. The occurrence may contain colons.
                This is not a work item ID. Use the execution document's `data.id` to report results.
            type:
              type: string
              description: >-
                "answer" for an answer run (a reply to a conversation message; id is the execution id,
                not a work item id). Work runs carry the work item type. Schedule runs carry "schedule".
            title:
              type: string
            body:
              type: string
            tags:
              type: array
              items:
                type: string
            status:
              type: string
            ref:
              type: string
            initiative_key:
              type: string
            dependencies:
              type: array
              description: >-
                Present when the work item depends on others (`depends_on_ids`): for each dependency its id,
                ref, title, status, final outcome and outputs.
              items:
                $ref: "#/components/schemas/RunDependency"
        assignment:
          type: object
          additionalProperties: false
          required: [goal, granted_tools, rules]
          properties:
            goal:
              type: string
              description: >-
                For an answer run: the accepted body of the account's conversation procedure (a Standard of
                kind `procedure`, key from the account's `conversation_answer_settings.procedure_key`),
                which tells the agent to act with its granted tools; the conversation's context record and
                its directly related records; the rolling summary of earlier messages when the conversation
                is longer than the history window; and the last `history_limit` conversation messages as
                "Operator:" / "Assistant:" lines, each truncated to `message_limit` characters (both
                account data). While an answer run is active, follow-up operator messages are delivered
                into it (see `listOperatorMessages`). Return the reply in the delivery's answer field. Role instructions, granted tools, rules and budget apply as for work runs.
                For a schedule run: the step's procedure, the node, the node's Autonomat context as the
                source of truth (no files or vault exist to read) and the results of earlier steps. A
                product node's context holds purpose, stage, health and revenue, accepted documents
                (each truncated to 4000 characters), initiatives with status, open and blocked work,
                open Inbox items, and recent signals and activity (lists capped at 20). A root node's
                context holds the strategy document and a summary of every product.
            role_instructions:
              type: string
            granted_tools:
              type: array
              items:
                type: string
            rules:
              type: string
            assigned_role:
              type: string
              nullable: true
            limits:
              type: object
              additionalProperties: false
              required: [timeout_ms]
              description: >-
                Limits of the run, from the role's `max_turns` and `run_timeout`. A run without a role gets the
                default timeout (7200 seconds).
              properties:
                max_turns:
                  type: integer
                  description: Most agent turns. Absent when the role states no turn limit.
                timeout_ms:
                  type: integer
                  description: Most milliseconds the run may take.
            budget:
              type: object
              nullable: true
              additionalProperties: false
              required: [daily_spend, remaining, limits]
              properties:
                daily_spend:
                  type: object
                  additionalProperties: false
                  required: [amount_minor, currency]
                  properties:
                    amount_minor:
                      type: integer
                    currency:
                      type: string
                remaining:
                  type: object
                  additionalProperties: false
                  required: [amount_minor, currency]
                  properties:
                    amount_minor:
                      type: integer
                    currency:
                      type: string
                limits:
                  type: array
                  maxItems: 0
                  description: Reserved. Always an empty array today; the daily limits are checked by the dispatch gate.
                  items:
                    $ref: "#/components/schemas/BudgetLimit"
        tool_definitions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, description, interface, command, allowed_commands, invocation, input_schema, credential_mapping, creates_watch, external_id_path, external_url_path, read_operation, states, signal_source_id, cost_path]
            properties:
              credential_mapping:
                $ref: "#/components/schemas/ToolCredentialMapping"
              creates_watch:
                type: boolean
              external_id_path:
                type: string
                nullable: true
              external_url_path:
                type: string
                nullable: true
              read_operation:
                $ref: "#/components/schemas/ToolReadOperation"
              states:
                $ref: "#/components/schemas/ToolStates"
              signal_source_id:
                type: integer
                nullable: true
              cost_path:
                $ref: "#/components/schemas/ToolCostPath"
              id:
                type: string
              name:
                type: string
                description: The capability key.
              description:
                type: string
              interface:
                type: string
                enum: [cli, http, mcp]
                description: Execute only the configured CLI subcommands, HTTP operations or MCP server tools.
              command:
                type: string
                nullable: true
                description: The CLI command for a cli tool; null otherwise.
              allowed_commands:
                type: array
                items:
                  type: string
                description: The configured subcommands, HTTP operation names or MCP server tool names. Empty for flag-only CLI.
              invocation:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                required: [kind]
                properties:
                  kind:
                    type: string
                    enum: [cli, http, mcp]
                    description: Always equal to `interface`.
                  command:
                    type: string
                  reference:
                    type: string
                  method:
                    type: string
                  operations:
                    type: object
                    description: "cli: subcommand to the operationId of the API operation it calls (only commands that call this API)."
                    additionalProperties:
                      type: string
                  flag_only:
                    type: boolean
                    description: "cli: true when the capability is one tool defined by `allowed_flags` instead of `allowed_commands`; its worker tool name is the command with whitespace joined by underscores and characters outside A-Za-z0-9_- replaced by underscores. Existing name length and account collision checks apply. Cannot be combined with non-empty `allowed_commands` or `operations`."
                  allowed_flags:
                    type: array
                    minItems: 1
                    description: "cli, requires `flag_only: true`: the flags the agent may pass. A non-empty list; names are unique across entries, even when other fields differ."
                    items:
                      type: object
                      additionalProperties: false
                      required: [name]
                      properties:
                        name:
                          type: string
                          pattern: "^[A-Za-z0-9_-]{1,64}$"
                        type:
                          type: string
                          enum: [string, bool, int, float64, stringArray]
                          default: string
                        required:
                          type: boolean
                        path:
                          type: boolean
                          description: May only be present with type `string` (including the default), even when false.
                        description:
                          type: string
                  allowed_hosts:
                    type: array
                    items:
                      type: string
                  allowed_hosts_from:
                    type: string
                    enum: [product_live_urls]
                    description: "`product_live_urls`: at run-build time the allowed hosts are the static `allowed_hosts` plus the hosts of every active product's site-kind `external_refs` url in the account."
                  max_body_bytes:
                    type: integer
              credentials:
                type: object
                additionalProperties: false
                description: "Write-only run payload data: the capability's named credentials resolved through its `invocation` mapping (`env` and `files` for cli, `headers` for http). Present only for a granted capability with a mapping and active account credentials holding the mapped values; a capability that cannot be resolved is left out with a run warning. Carried by this document only, never returned by any other endpoint, log, event or stored snapshot."
                properties:
                  env:
                    type: object
                    description: Environment variable name to value (cli).
                    additionalProperties:
                      type: string
                  headers:
                    type: object
                    description: HTTP header name to value (http).
                    additionalProperties:
                      type: string
                  files:
                    type: array
                    description: "File credentials (cli). The worker writes `content` to a file and sets the environment variable `name` to its path."
                    items:
                      type: object
                      additionalProperties: false
                      required: [name, content, as]
                      properties:
                        name:
                          type: string
                        content:
                          type: string
                        as:
                          type: string
                          enum: [file]
              input_schema:
                type: object
                additionalProperties: false
                required: [type, properties]
                properties:
                  type:
                    type: string
                    enum: [object]
                  properties:
                    type: object
                    description: One JSON Schema property per tool input, keyed by input name.
                    additionalProperties:
                      $ref: "#/components/schemas/ToolInputProperty"
                  required:
                    type: array
                    description: The names of the required inputs (JSON Schema `required`). Absent when no input is required.
                    items:
                      type: string
                description: JSON Schema for the configured tool arguments. CLI adds allowed subcommands and args or configured flags. HTTP uses its request template. MCP uses configured inputs and allowed server tools. Grants and approval requirements apply to all interfaces.
              approval_required:
                type: boolean
                description: >-
                  True when a policy (`requires: approval`) gates calls of this tool. The agent must not run a gated
                  call; it submits the exact call with `POST /pending_calls` (operationId `createPendingCall`) and
                  an operator decides in the Inbox. A refinement or initiative reuses its approved workable
                  permission grant: covered actions are not gated again. Always false in an `approved_call` run.
              governing_policy:
                type: string
                nullable: true
                description: The key of the policy that gates this tool; null when `approval_required` is false.
              approval_subcommands:
                type: array
                items:
                  type: string
                description: The subcommands or operations that need approval; empty when every call of the tool does (or when not gated).
        approved_call:
          type: object
          additionalProperties: false
          required: [inbox_item_id, capability, arguments]
          description: >-
            Present only in a run of kind `approved_call`, which Autonomat dispatches once when an operator approves
            a submitted call. The run performs exactly this call and nothing else, then reports the result as its
            answer; the result is recorded on the Inbox item. An approved call is never retried.
          properties:
            inbox_item_id:
              type: string
              description: The approved Inbox item (a call is executed at most once per item).
            capability:
              type: string
              description: The capability key to call.
            arguments:
              type: object
              description: The exact arguments the run submitted and the operator approved.
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
        model_credential:
          $ref: "#/components/schemas/ModelCredentialPayload"
        api_token:
          type: object
          additionalProperties: false
          required: [token, expires_at]
          description: >-
            A short-lived API token bound to this run (`Authorization: Bearer <token>`). It expires at
            `expires_at` or when the run reaches a terminal state, whichever is first. The run may call only
            its own model credential refresh operation, or the operations a capability granted to its role lists by operationId (for example the allowed
            subcommands of a CLI capability), and only on records inside its node. A denied request
            returns 403 naming the operation. Each fetch of this document issues a new token and revokes the
            earlier one. Absent for a run that is already terminal. The token lives for the role's `run_timeout`
            plus a fixed margin (`RUN_TOKEN_MARGIN_MINUTES`, default 15 minutes); a run without a role uses
            the default timeout (7200 seconds).
          properties:
            token:
              type: string
            expires_at:
              type: string
              format: date-time
        provided_values:
          type: array
          description: >-
            Values a person provided to Inbox items that blocked this work item (the resolution of an item with a
            typed `value_request` input), including decision option keys and any selected option input, oldest item first.
            For decisions, `value` is the option key and `supplied_value` is the normalized input when present;
            label, type and use describe the selected option request. Absent when none were provided.
          items:
            type: object
            additionalProperties: false
            required: [inbox_item_id, label, use, value]
            properties:
              inbox_item_id:
                type: string
              label:
                type: string
              type:
                type: string
                description: The input type (text, number, date, choice or url).
              use:
                type: string
                description: What Autonomat does with the value.
              value:
                type: string
              supplied_value:
                type: string
                description: Normalized input for a selected decision option; value holds the option key.
        callback:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url:
              type: string
    RunInboxItemUpdateDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [attributes]
          properties:
            type:
              type: string
              enum: [inbox-items]
            attributes:
              type: object
              additionalProperties: false
              x-required-by-category:
                decision: ["question","context","options","recommendation","evidence","cost_of_waiting","title","reason","continuation","denial_continuation"]
                approval: ["title","request","reason","denial_continuation"]
                access: ["steps","reason","unblocks","evidence","continuation","value_request","title"]
                information: ["request","context","evidence","continuation","value_request","title","reason"]
                review: ["request","context","evidence","continuation","title","reason","value_request"]
                attestation: ["request","context","evidence","continuation","title","reason"]
                external_action: ["steps","reason","unblocks","evidence","continuation","value_request","title"]
              description: >
                Only the given parts change; give at least one and none may be blank. A pending owned
                item must keep every effective category minimum plus account-configured requirement (`GET /inbox_requirements`);
                a missing or blank required part is a 422 with one `source.pointer` (`/data/attributes/<part>`) per part, and a value that is not a string (a text part) is a 422 pointing at that attribute. `x-required-by-category` states the default required parts per category.
              properties:
                content_intent:
                  type: string
                  enum: [brief, review, facts, edits, reasons]
                  description: Declares content that requires a valid required input value_request in any category. Review and information always require content input. Content requested in decision choices requires a required input on every option. Use long_text by default.
                requested_operation:
                  $ref: "#/components/schemas/InboxRequestedOperation"
                title:
                  type: string
                question:
                  type: string
                  description: The decision to make, as one question (decision items).
                context:
                  type: string
                  description: What a person needs to know to answer or act.
                options:
                  $ref: "#/components/schemas/InboxOptions"
                steps:
                  type: string
                  description: The exact actions, systems, URLs and values (external_action and access items).
                request:
                  type: string
                reason:
                  type: string
                  description: Why a person is needed.
                unblocks:
                  type: string
                  description: What the item unblocks once it is handled.
                evidence:
                  type: string
                recommendation:
                  type: string
                  description: The key of the recommended option (decision items).
                continuation:
                  type: string
                  description: What Autonomat does after the item is resolved or marked complete, and how it checks the result.
                denial_continuation:
                  type: string
                cost_of_waiting:
                  type: string
                  description: What delay costs.
                value_request:
                  $ref: "#/components/schemas/InboxValueRequest"
