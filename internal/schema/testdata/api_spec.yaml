  /runs/{run_id}/execution:
    get:
      summary: Read the execution payload of an admitted run
      operationId: getRunExecution
      description: >-
        Read-only, including credential rereads. A run token requires the execution read grant and may read only its own run.
        A valid current-attempt token is returned without renewal. Use POST /runs/{run_id}/token to renew it.
      security:
        - apiToken: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Admitted run execution payload
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/RunExecutionDocument"
        "401":
          description: Unauthorized, including an expired run token
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "403":
          description: Run token is not permitted to read this execution
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "404":
          description: Run not found in the account
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "409":
          description: Run has not been admitted
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
    post:
      summary: Admit a queued run and return its execution payload
      operationId: createRunExecution
      description: >-
        Requires an account API token and an empty request body. Repetition returns the admitted document without
        consuming approvals again or renewing a token. A strictly higher native retry count requests a new attempt
        on the same run. An allowed attempt rotates the token once. Refused attempts remain refused when repeated.
      security:
        - apiToken: []
      parameters:
        - name: retry_count
          in: query
          required: false
          description: Hatchet native retry count, starting at zero; retries retain the execution and rotate its attempt-scoped token.
          schema:
            type: integer
            minimum: 0
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run execution payload
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/RunExecutionDocument"
        "401":
          description: Unauthorized, including an expired run token
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "403":
          description: Admission requires an account API token
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "404":
          description: Not found
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "409":
          description: >-
            Run is terminal, its initiating cause is stale, its review is deferred, or dispatch is blocked by
            a pause or stop control, paused initiative or unfinished dependencies. The reason is in
            `errors[0].title`; for dependencies it lists the items waited on.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: >-
            Run cannot be dispatched (unusable credential, budget or policy), or the node context of a schedule run
            could not be built (the execution is then failed with the error as its reason).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /runs/{run_id}/result:
    post:
      summary: Submit the run's final result
      operationId: createRunResult
      description: >-
        Requires the target run's own usable run token and a granted tool that maps this operation.
        Stores the result while the run is running. The agent service's terminal report ends the run
        and uses the stored result. An identical retry succeeds without changing the stored result.
        A NUL character in the answer or work outcome note returns 422.
      security:
        - apiToken: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              required: [data]
              properties:
                data:
                  type: object
                  additionalProperties: false
                  required: [attributes]
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      required: [answer]
                      properties:
                        answer:
                          type: string
                          minLength: 1
                          pattern: '\S'
                          description: Nonblank final answer text without NUL characters.
                        item_outcome:
                          description: Required for work runs and accepted only for work runs. Reports progress without verifying the work.
                          allOf:
                            - $ref: "#/components/schemas/ItemOutcomeInput"
      responses:
        "204":
          description: Result accepted or already submitted with identical content
        "401":
          description: Missing or unusable token, including expired, revoked or terminal-run credentials
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "403":
          description: An account token, another run's token or a run without the operation grant
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "409":
          description: The run is not running or a different result has already been accepted
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Malformed request or missing or invalid result fields
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /runs/{run_id}/model_credential:
    patch:
      summary: Save the run's refreshed model credential
      operationId: refreshRunModelCredential
      description: >-
        Requires the run's own live token and assigned refreshable credential. No capability is required.
        Replaces the complete encrypted secret using atomic compare-and-swap on the delivered version.
        Stale versions return 409 without mutation.
        Credential identifiers are rejected. All responses are no-store and contain no secret.
      security:
        - apiToken: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              required: [data]
              properties:
                data:
                  type: object
                  additionalProperties: false
                  required: [attributes]
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      required: [version, secret]
                      properties:
                        version:
                          type: integer
                          minimum: 0
                        secret:
                          type: string
                          description: Complete Codex auth.json string as described in RunExecutionAttributes.
      responses:
        "200":
          description: Updated version only
          content:
            application/vnd.api+json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [type, id, attributes]
                    properties:
                      type:
                        type: string
                        enum: [model_credential_versions]
                      id:
                        type: string
                      attributes:
                        type: object
                        additionalProperties: false
                        required: [version]
                        properties:
                          version:
                            type: integer
        "401":
          description: Invalid or expired token
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "403":
          description: Not the owning run token
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "404":
          description: Run or assigned credential not found
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "409":
          description: Stale credential version
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Invalid input or credential cannot refresh
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /runs/{run_id}/token:
    post:
      summary: Refresh the run token of a run
      operationId: refreshRunToken
      description: >-
        Revokes the run's current token and issues a new one with a fresh lifetime (the role's `run_timeout` plus a fixed margin), returned as `api_token`
        (`token`, `expires_at`). Authenticated by the run's own token while it is still valid, or by an account
        token. An expired token is a 401 ("run token expired"); fetch the payload again to obtain a new token.
        A terminal run gets no token (409). A run token of another run is a 403. Needs no capability grant.
      security:
        - apiToken: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fresh run token
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/RunTokenDocument"
        "401":
          description: Unauthorized, or the run token has expired ("Credential not accepted. run token expired.")
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "403":
          description: The run token belongs to another run
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "404":
          description: Run not found
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "409":
          description: The run is terminal; no token is issued
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: The request body is not a valid JSON:API document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /webhooks/signal_sources/{signal_source_id}/signals:
    post:
      summary: Receive a source message as an immutable signal fact
      operationId: deliverSignal
      description: >-
        Bearer sources accept the provider message in data.attributes. Signed sources use their configured
        header and secret with HMAC over the exact request bytes, encoded as lowercase hex with the
        configured literal prefix if present. Supported digests are SHA256, SHA384 and SHA512.
        Send a plain JSON object with a nonblank string or integer in the configured top-level event
        ID field. The source owns the delivery and applies its message mapping to the whole object.
        Repeated event IDs within a source return the original signal with status 201. Missing or
        invalid signatures return 401, missing or inactive sources return 404, and invalid JSON,
        event identities or messages return 422.
      security:
        - webhookToken: []
        - signalSignature: []
      parameters:
        - name: signal_source_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              required: [data]
              properties:
                data:
                  type: object
                  additionalProperties: false
                  required: [attributes]
                  properties:
                    attributes:
                      type: object
                      description: Provider message interpreted using the source message mapping.
                      additionalProperties:
                        $ref: "#/components/schemas/JsonValue"
      responses:
        "201":
          description: New fact or counted duplicate
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SignalDocument"
        "401":
          description: Request refused
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "404":
          description: Request refused
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Request refused
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /webhooks/agent:
    post:
      summary: Deliver agent run results
      description: >-
        For a schedule run, authenticate with the webhook token and send a JSON:API document
        with `data.type` set to `run-results` and `data.id` set to the execution ID.
        Every report requires a `status` and a meaningful `description` explaining the transition.
        Terminal reports require a nonblank `summary` describing the result.
        A terminal report uses the answer and work item outcome already accepted by `createRunResult`.
        It may omit both fields. Valid legacy result fields are used when the run has no accepted submission.
        For success, send `succeeded` (legacy aliases `finished` and `completed` also work)
        and optionally supply the schedule output as a string in `answer`.
        For failure, send `failed`, explain the cause in `summary`, and optionally provide
        `failure_reason` or `item_outcome.note` for the stored reason.
        Omit `item_outcome` on success. When supplied, it is validated and retained on terminal reports
        without applying a work-item transition. Its `state` of `failed`, `interrupted` or `stopped`
        normalizes a reported success to failure.
        The acknowledgement returns the execution state and finish time.

        Queued runs without sent_at accept only status: failed. The delivery records failed state,
        failure_reason from item_outcome.note (a nonblank string, trimmed and limited to 1000 characters,
        without replacing an existing reason), and finished_at (current time when omitted or invalid).
        It does not set sent_at or invent started_at; started_at may come from the delivery or its actions.
        The failed delivery activity is recorded and schedule advancement is requested, freeing capacity
        for waiting executions or advancing a completed step. Other unsent deliveries return 422.
        Terminal runs return 409, including unsent runs and duplicate failed deliveries.
        A delivery whose request body is identical to the last delivery accepted for a running run returns 200
        and is not applied again.
      operationId: deliverAgentRunResults
      security:
        - webhookToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/RunDeliveryDocument"
      responses:
        "200":
          description: Run result accepted
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/RunResultDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "404":
          description: Run not found
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "409":
          description: >-
            The run is already terminal (finished, completed or failed). The delivery changes nothing, performs no
            requested action and is recorded as an `execution`/`delivery_rejected` activity event.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: >-
            Validation error, missing or invalid description, missing terminal summary, unknown status (not one of running, succeeded, finished, completed, failed, cancelled), or run not
            dispatched (except a failed delivery for a queued run without sent_at).
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
