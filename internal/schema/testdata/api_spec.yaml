openapi: "3.0.3"
info:
  title: Autonomat API
  version: "4.0.0"
components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
    webhookToken:
      type: http
      scheme: bearer
  schemas:
    JsonValue:
      description: Any JSON value (string, number, boolean, array or object), used for free-form maps.
      nullable: true
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    BudgetLimit:
      type: object
      additionalProperties: false
      required: [level, amount_minor, currency]
      description: A daily spend limit. Reserved; the budget `limits` array is currently always empty.
      properties:
        level:
          type: string
          enum: [initiative, product, account]
        amount_minor:
          type: integer
        currency:
          type: string
    ErrorObject:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          additionalProperties: false
          properties:
            pointer:
              type: string
            parameter:
              type: string
        meta:
          type: object
          additionalProperties: false
          properties:
            operation_id:
              type: string
    ErrorDocument:
      type: object
      additionalProperties: false
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorObject"
    AccountAttributes:
      type: object
      additionalProperties: false
      required: [name, worker_ingest_token_configured, work_item_status_map, conversation_answer_settings, work_item_procedure_key, external_ref_display_rules]
      properties:
        name:
          type: string
        worker_address:
          type: string
          nullable: true
        worker_ingest_token_configured:
          type: boolean
        default_connection_id:
          type: string
          nullable: true
        work_sync_interval_minutes:
          type: integer
          minimum: 1
          description: Minutes between work tracker syncs for this account.
        work_item_status_map:
          $ref: "#/components/schemas/WorkItemStatusMap"
        conversation_answer_settings:
          $ref: "#/components/schemas/ConversationAnswerSettings"
        work_item_procedure_key:
          type: string
          description: Key of the Standard (kind procedure) whose accepted body starts every work item run's goal. Default `work-item-dispatch`.
        external_ref_display_rules:
          $ref: "#/components/schemas/ExternalRefDisplayRules"
    ExternalRefDisplayRules:
      type: object
      additionalProperties: false
      required: [rules, fallback]
      description: >-
        Account data stating how a product's external references are written in agent context. The first
        rule whose `tool` (when given) equals the reference's tool and whose `kinds` (when given) include
        its kind supplies the `template`; otherwise `fallback`. Templates must contain `{ref}` and may
        use `{tool}`, `{kind}` and `{ref}`. The url and label are always appended.
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRefDisplayRule"
        fallback:
          type: string
    ExternalRefDisplayRule:
      type: object
      additionalProperties: false
      required: [template]
      properties:
        tool:
          type: string
        kinds:
          type: array
          items:
            type: string
        template:
          type: string
    ConversationAnswerSettings:
      type: object
      additionalProperties: false
      properties:
        procedure_key:
          type: string
          description: Key of the accepted `procedure` Standard whose body instructs answer runs. A missing or blank procedure fails the run and posts the reason to the conversation.
        history_limit:
          type: integer
          minimum: 1
          description: Number of latest conversation messages given to an answer run; older messages are folded into the rolling conversation summary.
        message_limit:
          type: integer
          minimum: 1
          description: Characters kept of each history message.
        summary_line_limit:
          type: integer
          minimum: 1
          description: Characters kept of each message in the rolling summary.
        summary_limit:
          type: integer
          minimum: 1
          description: Characters kept of the rolling summary (oldest lines dropped first; earlier summary records are kept).
      description: >-
        Account data for conversation answer runs. All keys are present on read; on update a partial object
        changes only the given keys.
    WorkItemStatusMap:
      type: object
      additionalProperties:
        type: string
      description: >-
        Account data mapping a run's `item_outcome.state` to a work item status. Exactly the keys
        `completed` (completed with no open external work, default `done`), `completed_open_external_work`
        (completed while the item has external refs, default `in_progress`), `interrupted` (default `ready`),
        `stopped` (default `ready`) and `failed` (default `ready`); each value is one of the work item statuses. An `item_outcome.state`
        with no key here is not applied: the delivery is accepted, the status stays and the reason is
        recorded as the run's `failure_reason`.
    AccountResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [account]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/AccountAttributes"
    AccountDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AccountResource"
    KeyMetric:
      type: object
      additionalProperties: false
      required: [key, kind, field, money]
      properties:
        key:
          type: string
          description: Metric key, lowercase letters, digits and underscores, unique in the list.
        kind:
          type: string
          description: Signal kind the readings come from (one of the signal kinds).
        field:
          type: string
          description: Field in the reading's fields holding the value.
        money:
          type: boolean
          description: True when the value is money (integer minor units plus a currency field).
    HealthStandard:
      type: object
      additionalProperties: false
      required: [value, method, statistic, min_products]
      properties:
        value:
          type: number
          description: Current portfolio standard growth rate in percent. A statistic method overwrites it daily.
        method:
          type: string
          enum: [fixed, statistic]
        statistic:
          type: string
          enum: [mean, median, min, max]
        min_products:
          type: integer
          minimum: 1
    HealthStateRule:
      type: object
      additionalProperties: false
      required: [state, when]
      properties:
        state:
          type: string
          enum: [healthy, at_risk, unhealthy, unknown]
        when:
          type: string
          enum: [any_missing, all_at_or_above, all_below, some_below]
    HealthRulesAttributes:
      type: object
      additionalProperties: false
      required: [window_days, key_metrics, standard, state_rules]
      properties:
        window_days:
          type: integer
          minimum: 1
          maximum: 365
        key_metrics:
          type: array
          items:
            $ref: "#/components/schemas/KeyMetric"
        standard:
          $ref: "#/components/schemas/HealthStandard"
        state_rules:
          type: array
          description: Evaluated in order; the first matching rule sets the state, no match means unknown.
          items:
            $ref: "#/components/schemas/HealthStateRule"
    HealthRulesResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [health-rules]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/HealthRulesAttributes"
    HealthRulesDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/HealthRulesResource"
    StatusDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/StatusResource"
    StatusResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [status]
        id:
          type: string
          enum: [current]
        attributes:
          $ref: "#/components/schemas/StatusAttributes"
    StatusAttributes:
      type: object
      additionalProperties: false
      required: [version, sha, db_version]
      properties:
        version:
          type: string
          nullable: true
        sha:
          type: string
          nullable: true
        db_version:
          type: string
          nullable: true
    RunDependency:
      type: object
      additionalProperties: false
      required: [id, title, status, outcome, outputs]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        outcome:
          type: string
          nullable: true
        outputs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, reference, result]
            properties:
              id:
                type: string
              kind:
                type: string
              reference:
                type: string
                nullable: true
              result:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
    WorkItemOutput:
      type: object
      additionalProperties: false
      required: [id, execution_id, kind, reference, result]
      properties:
        id:
          type: string
        execution_id:
          type: string
        kind:
          type: string
        reference:
          type: string
          nullable: true
        result:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    WorkItemAttributes:
      type: object
      additionalProperties: false
      required: [item_type, title, source_kind, status]
      properties:
        item_type:
          type: string
        title:
          type: string
        body:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        source_kind:
          type: string
          description: >
            Origin of the item. "human" means the item was created from an operator message
            (operator message flow). "schedule" means the item was created automatically
            by schedule execution (ScheduleTickWorker processing a schedule occurrence).
        source_ref:
          type: string
          nullable: true
          description: >
            Stable reference identifying the item's origin. For schedule-sourced items
            the format is "{schedule_key}:{occurrence_date}:{step_index}:{node_key}"
            (e.g. "daily-ops:2026-09-24:0:node-alpha"). For human-sourced items the format
            is "message:{operator_message_id}".
        status:
          type: string
        dispatch_reason:
          type: string
          nullable: true
        next_action:
          type: string
          nullable: true
          description: What should happen next with this work item (free text, at most 2000 characters).
        external_refs:
          type: array
          description: >-
            Work created in connected tools. tracked is true when an account work tracker matches tool and
            kind (state and terminal then follow the external work); an untracked ref is shown as not tracked.
          items:
            $ref: "#/components/schemas/WorkItemExternalRef"
        outcome:
          type: string
          nullable: true
          description: >-
            Latest outcome: the answer of the item's newest finished or completed run (approved-call runs
            excluded), null when no run has reported one. Read-only.
        outputs:
          type: array
          description: >-
            Outputs (kind, reference, result) reported by the actions of every run of the item, oldest
            first. Read-only.
          items:
            $ref: "#/components/schemas/WorkItemOutput"
        ref:
          type: string
          nullable: true
          description: >
            Stable work reference, unique per account. Backfilled from vault_task_key
            where present; falls back to "#id" when absent.
        intake_status:
          type: string
          nullable: true
          description: >
            Processing state for human-signal items: pending, no_work, failed, or confirmed.
            Null for non-human-sourced items.
        parent_id:
          type: integer
          nullable: true
        merged_into_id:
          type: integer
          nullable: true
        depends_on_ids:
          type: array
          description: >
            Ids of work items of the account this item waits on. An item is dispatched only once every one
            of them is done, closed or cancelled; it is dispatched automatically when the last one completes.
            Unknown ids, the item itself and cycles are rejected with 422.
          items:
            type: integer
        connection_id:
          type: string
          nullable: true
        agent_role_id:
          type: string
          nullable: true
        product_id:
          type: integer
          nullable: true
        workable_type:
          type: string
          nullable: true
        workable_id:
          type: integer
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
    WorkItemResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [work-items]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/WorkItemAttributes"
        links:
          $ref: "#/components/schemas/ResourceLinks"
    WorkItemDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/WorkItemResource"
    WorkItemCreateAttributes:
      type: object
      additionalProperties: false
      required: [item_type, title, product_id, workable_type, workable_id]
      description: >
        What a work item is created from. A work item belongs to a product and to a workable (an initiative or a
        refinement): `product_id`, `workable_type` and `workable_id` are all required. `source_kind` and `status`
        are optional for an account token (they default to `api` and `open`); a run token sets only item_type,
        title, body, tags, product_id and the workable, the rest is fixed by the run.
      properties:
        item_type:
          type: string
        title:
          type: string
        body:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        source_kind:
          type: string
          default: api
          description: Origin of the item. Defaults to `api`. Ignored for a run token (always `run`).
        source_ref:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, closed, cancelled, queued, sent, running, finished, failed, done, in_progress, ready]
          default: open
          description: Defaults to `open`. Ignored for a run token (always `open`).
        dispatch_reason:
          type: string
          nullable: true
        parent_id:
          type: integer
          nullable: true
        merged_into_id:
          type: integer
          nullable: true
        depends_on_ids:
          type: array
          description: >
            Ids of work items of the account this item waits on. An item is dispatched only once every one
            of them is done, closed or cancelled; it is dispatched automatically when the last one completes.
            Unknown ids, the item itself and cycles are rejected with 422.
          items:
            type: integer
        connection_id:
          type: string
          nullable: true
        agent_role_id:
          type: string
          nullable: true
        product_id:
          type: integer
          description: The product (of the account) the work belongs to.
        workable_type:
          type: string
          enum: [Initiative, Refinement]
          description: The kind of record the work belongs to. Required together with `workable_id`.
        workable_id:
          type: integer
          description: The id of the initiative or refinement named by `workable_type`.
    WorkItemCreateResource:
      type: object
      additionalProperties: false
      required: [attributes]
      properties:
        type:
          type: string
          enum: [work-items]
        attributes:
          $ref: "#/components/schemas/WorkItemCreateAttributes"
    WorkItemCreateDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/WorkItemCreateResource"
    WorkItemsDocument:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemResource"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/PageMeta"
    ResourceLinkage:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string
    ProductSummaryAttributes:
      type: object
      additionalProperties: false
      required: [name, stage, health_state]
      properties:
        key:
          type: string
          nullable: true
        name:
          type: string
        stage:
          type: string
        health_state:
          type: string
    ProductSummaryResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes, links]
      properties:
        type:
          type: string
          enum: [products]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/ProductSummaryAttributes"
        links:
          $ref: "#/components/schemas/ResourceLinks"
    InitiativeDocumentAttributes:
      type: object
      additionalProperties: false
      required: [state, body, accepted, created_at]
      properties:
        state:
          type: string
        summary:
          type: string
          nullable: true
        body:
          type: string
        accepted:
          type: boolean
          description: True when this revision is the initiative's accepted one.
        created_at:
          type: string
    InitiativeDocumentResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes, links]
      properties:
        type:
          type: string
          enum: [documents]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/InitiativeDocumentAttributes"
        links:
          $ref: "#/components/schemas/ResourceLinks"
    InitiativeRelationships:
      type: object
      additionalProperties: false
      required: [products, documents]
      properties:
        products:
          type: object
          additionalProperties: false
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ResourceLinkage"
        documents:
          type: object
          additionalProperties: false
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ResourceLinkage"
    InitiativeAttributes:
      type: object
      additionalProperties: false
      required: [key, title, status, automatic_dispatch_paused, created_at, updated_at]
      properties:
        key:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, active, concluded, abandoned]
          description: '"abandoned" is the archived state; archiving never deletes the initiative.'
        automatic_dispatch_paused:
          type: boolean
        daily_budget_cents:
          type: integer
          nullable: true
        started_on:
          type: string
          nullable: true
        target_on:
          type: string
          nullable: true
        concluded_on:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
    InitiativeResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes, links]
      properties:
        type:
          type: string
          enum: [initiatives]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/InitiativeAttributes"
        links:
          $ref: "#/components/schemas/ResourceLinks"
        relationships:
          $ref: "#/components/schemas/InitiativeRelationships"
    InitiativeIncludedResource:
      oneOf:
        - $ref: "#/components/schemas/ProductSummaryResource"
        - $ref: "#/components/schemas/InitiativeDocumentResource"
    InitiativeDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/InitiativeResource"
        included:
          type: array
          description: The member products and documents named in the relationships.
          items:
            $ref: "#/components/schemas/InitiativeIncludedResource"
    InitiativesDocument:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/InitiativeResource"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/PageMeta"
    RefinementAttributes:
      type: object
      additionalProperties: false
      required: [title, status, product_id, created_at, updated_at]
      properties:
        title:
          type: string
        status:
          type: string
          enum: [active, complete, archived]
          description: '"archived" is the archived state; archiving never deletes the refinement.'
        product_id:
          type: string
        diagnosis:
          type: string
          nullable: true
        bounded_scope:
          type: string
          nullable: true
        expected_outcome:
          type: string
          nullable: true
        execution_path:
          type: string
          nullable: true
        outcome:
          type: string
          nullable: true
        verification_notes:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
    RefinementResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes, links]
      properties:
        type:
          type: string
          enum: [refinements]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/RefinementAttributes"
        links:
          $ref: "#/components/schemas/ResourceLinks"
    RefinementDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RefinementResource"
    RefinementsDocument:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RefinementResource"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/PageMeta"
    MoneyInput:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
        currency:
          type: string
    CostConversionInput:
      type: object
      additionalProperties: false
      properties:
        source_amount_minor:
          type: integer
        source_currency:
          type: string
        rate:
          type: string
    OutputInputAttributes:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
        reference:
          type: string
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: Free-form result map reported by the agent; stored as sent (empty map when omitted).
    ActionInputAttributes:
      type: object
      additionalProperties: false
      properties:
        usage_notional:
          allOf:
            - $ref: "#/components/schemas/MoneyInput"
          description: >-
            Subscription usage valued at API prices. It is stored as `usage_notional`, never as cost, and
            is not counted in any spend. When the run's connection is a subscription credential, a
            `cost_actual` sent for the action is stored as `usage_notional` instead.
        id:
          type: string
        kind:
          type: string
        target:
          type: string
        status:
          type: string
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        capability:
          type: string
          nullable: true
        tool_id:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
          description: Tool, subcommand and arguments of the call. Stored as plain text, truncated to 2000 characters.
        failure_reason:
          type: string
          nullable: true
          description: Error text, exit code with stderr, or refused subcommand. Stored as plain text, truncated to 2000 characters; a refusal decided by Autonomat takes precedence.
        cost_unit:
          type: string
          nullable: true
        cost_quantity:
          type: integer
          nullable: true
        cost_estimate:
          $ref: "#/components/schemas/MoneyInput"
        cost_actual:
          $ref: "#/components/schemas/MoneyInput"
        cost_conversion:
          $ref: "#/components/schemas/CostConversionInput"
        cost_pending:
          type: boolean
          nullable: true
        external_ref:
          $ref: "#/components/schemas/ExternalRefInput"
          nullable: true
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/OutputInputAttributes"
    ExternalRefInput:
      type: object
      additionalProperties: false
      required: [tool, kind, ref]
      description: >-
        Work the action created in a connected tool. It is stored on the action and merged into the
        work item's external_refs (existing refs are kept, a ref is never duplicated). When an account
        work tracker matches tool and kind, the ref is followed until the external work finishes;
        otherwise it is recorded and shown as not tracked. Non-empty strings for tool, kind and ref are
        required, otherwise the delivery is a 422 with a pointer to the ref.
      properties:
        tool:
          type: string
        kind:
          type: string
        ref:
          type: string
        url:
          type: string
          nullable: true
    WorkItemExternalRef:
      type: object
      additionalProperties: false
      required: [tool, kind, ref, url, tracked, state, terminal]
      properties:
        tool:
          type: string
        kind:
          type: string
        ref:
          type: string
        url:
          type: string
          nullable: true
        tracked:
          type: boolean
        state:
          type: string
          nullable: true
          description: The external state last read by the work tracker, null until read or when not tracked.
        terminal:
          type: boolean
    ActionCostAttributes:
      type: object
      additionalProperties: false
      description: >-
        Either a cost_actual, or closed: true with no cost_actual (null or absent) when the external work
        ended without a cost. A closed result records zero (or keeps an amount already recorded), stores
        the reason, sets the recorded-at time and clears cost_pending. Without cost_actual and without
        closed: true the request is a 422.
      properties:
        cost_actual:
          allOf:
            - $ref: "#/components/schemas/MoneyInput"
          nullable: true
        closed:
          type: boolean
          description: Marks the work as closed so a missing cost_actual is accepted.
        reason:
          type: string
          nullable: true
          description: Why the closed work has no cost (only used with closed).
        cost_conversion:
          $ref: "#/components/schemas/CostConversionInput"
          nullable: true
        external_ref:
          type: string
          nullable: true
          description: "External reference identifying the source that measured this cost (e.g. a LoopControl task id)"
    ActionCostUpdateDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [action-cost]
            attributes:
              $ref: "#/components/schemas/ActionCostAttributes"
    ActionCostResultDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
    ItemOutcomeInput:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          description: >-
            `completed`, `interrupted`, `stopped` or `failed`. The work item status is set from the account's
            `work_item_status_map` after the delivery's external refs are recorded; an unmapped value
            leaves the status unchanged and is recorded as the run's `failure_reason`.
        note:
          type: string
          nullable: true
          description: >-
            Why the run failed. For a run whose status is not finished or completed, the note is stored
            as the execution's failure_reason (first reason wins, trimmed to 1000 characters) and shown
            in the conversation ("The agent run failed: <note>", linked to the execution) and on the
            execution page. Without a note an answer run shows the generic "The agent run failed."
    CredentialRejectionInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    RunDeliveryAttributes:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [running, finished, completed, failed]
          description: >-
            Progress state (`running`) or terminal state (`finished`, `completed`, `failed`). Any other value is a 422
            with `source.pointer` `/data/attributes/status`. A delivery for a run that is already terminal is a 409.
        started_at:
          type: string
          nullable: true
          description: >-
            ISO 8601 time the agent started the run. When omitted, the earliest action start is used.
            A recorded start is never overwritten.
        finished_at:
          type: string
          nullable: true
        usage:
          type: object
          nullable: true
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: Free-form usage metrics. Accepted for backward compatibility and not stored.
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionInputAttributes"
        item_outcome:
          $ref: "#/components/schemas/ItemOutcomeInput"
          nullable: true
        credential_rejection:
          $ref: "#/components/schemas/CredentialRejectionInput"
          nullable: true
        answer:
          type: string
          nullable: true
          description: >-
            The reply to the operator for an answer run (a run that replies to a conversation message
            rather than doing work). Posted as one assistant message in the conversation. Ignored for
            runs on work items. Used only when status is finished or completed; when the run failed
            the failure note below is shown instead. Agent progress is never posted.
        external_refs:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required: [tool, kind, ref]
            description: Merged into the work item's external_refs (existing refs kept, no duplicates).
            properties:
              tool:
                type: string
              kind:
                type: string
              ref:
                type: string
              url:
                type: string
                nullable: true
              label:
                type: string
                nullable: true
              state:
                type: string
                nullable: true
                description: >-
                  State of the referenced work in its own tool. A reference without a state, or whose state is not
                  terminal (closed, done, completed, merged, cancelled, failed, finished, succeeded, applied,
                  destroyed, resolved), is open work and blocks dispatching the work item again.
