        (`type` text, number, date, choice or url; `required`; `options` for a choice; a `format_hint`; and `use`,
        what Autonomat does with the value); the value the operator provides is stored on the resolution and
        handed to the work that continues. `kind: place` names an exact place to deliver to (`location`: screen
        and field, or external system and location) with an optional `link` (an Autonomat path or an http(s) URL);
        the operator marks the item complete. Secrets are never entered into an item: an input of type `secret`, or an
        input whose label, format_hint or use asks for a password, passphrase, API key, secret, token or credential,
        is a 422 pointing at `/data/attributes/value_request`, and a place that asks for one must link to an Autonomat
        connection screen (`/settings/connections` or `/settings/model_access`).
      properties:
        kind:
          type: string
          enum: [input, place]
        label:
          type: string
        type:
          type: string
          enum: [text, number, date, choice, url]
          description: The type of an input.
        required:
          type: boolean
          default: true
        options:
          type: array
          items:
            type: string
          description: The allowed values of a choice input (at least two).
        format_hint:
          type: string
          description: The format an input expects.
        use:
          type: string
          description: What Autonomat does with the provided value.
        location:
          type: string
          description: Exactly where to deliver, for a place.
        link:
          type: string
          nullable: true
          description: An Autonomat path or an http(s) URL, for a place.
    InboxOptions:
      type: array
      description: >
        The choices of a decision, each `{key, label, consequence}` with a unique key. When the account requires
        `options` for the category it must hold 2 to 4 options, each with a consequence.
      items:
        $ref: "#/components/schemas/InboxOption"
    InboxItemCreateDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [attributes]
          properties:
            type:
              type: string
              enum: [inbox-items]
            attributes:
              type: object
              additionalProperties: false
              x-required-by-category:
                decision: ["question","context","options","recommendation","evidence","cost_of_waiting"]
                approval: ["request","reason"]
                access: ["steps","reason","unblocks","evidence","continuation","value_request"]
                information: ["request","context","evidence","continuation","value_request"]
                review: ["request","context","evidence","continuation"]
                attestation: ["request","context","evidence","continuation"]
                external_action: ["steps","reason","unblocks","evidence","continuation","value_request"]
              required: [category]
              description: >
                Files an operator-owned pending item. Which parts a category needs is account data
                (`GET /inbox_requirements`). The defaults are decision: question, context, options (2 to 4,
                each with a consequence), recommendation (naming an option key), evidence, cost_of_waiting;
                external_action and access: steps, reason, unblocks, evidence, continuation, value_request; approval: request,
                reason; information: request, context, evidence, continuation, value_request; review and attestation: request, context, evidence, continuation.
                A missing or blank required part is a 422 with one `source.pointer` (`/data/attributes/<part>`) per part; a value that is not a string (any part but `options`) is a 422 pointing at that attribute and nothing is stored. `x-required-by-category` states the default required parts per category.
              properties:
                category:
                  type: string
                  enum: [decision, approval, access, information, review, attestation, external_action]
                cause_key:
                  type: string
                  description: Identifies the cause; a second item with the same key is a 422. Generated when omitted.
                title:
                  type: string
                question:
                  type: string
                  description: The decision to make, as one question (decision items).
                context:
                  type: string
                  description: What a person needs to know to answer or act.
                options:
                  $ref: "#/components/schemas/InboxOptions"
                steps:
                  type: string
                  description: The exact actions, systems, URLs and values (external_action and access items).
                request:
                  type: string
                reason:
                  type: string
                  description: Why a person is needed.
                unblocks:
                  type: string
                  description: What the item unblocks once it is handled.
                evidence:
                  type: string
                recommendation:
                  type: string
                  description: The key of the recommended option (decision items).
                continuation:
                  type: string
                  description: What Autonomat does after the item is resolved or marked complete, and how it checks the result.
                denial_continuation:
                  type: string
                cost_of_waiting:
                  type: string
                  description: What delay costs.
                value_request:
                  $ref: "#/components/schemas/InboxValueRequest"
