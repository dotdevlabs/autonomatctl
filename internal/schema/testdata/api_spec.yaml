        - id: granted
          status: 200
          auth: runToken
        - id: paged
          status: 200
          auth: apiToken
          query:
            "page[number]": "1"
            "page[size]": "1"
        - id: unauthorized
          status: 401
          auth: invalidToken
        - id: expired_token
          status: 401
          auth: expiredRunToken
        - id: not_granted
          status: 403
          auth: runTokenUngranted
        - id: invalid_qualifier
          status: 422
          auth: apiToken
          query:
            "q": "badqualifier:x"
        - id: invalid_page_size
          status: 422
          auth: apiToken
          query:
            "page[size]": "0"
