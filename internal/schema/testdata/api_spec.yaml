  "/model_api_prices":
    get:
      operationId: listModelApiPrices
      description: Operator API tokens list active prices for their account. Enter rates manually in Settings → Model access → Model API prices or through this API. Settings writes require the configure permission. The default list shows active prices; use the archived settings link to find an archived price, then edit and save it to reactivate it. Run tokens cannot manage prices.
