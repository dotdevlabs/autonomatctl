  /conversations:
    get:
      summary: List conversations
      operationId: listConversations
      security:
        - apiToken: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Filter query supporting typed qualifiers.
            Example: `context_type:Product since:2026-10-01 sort:updated-desc`
            Unknown qualifiers return 422.
            A reference filter such as `product:` accepts the record's id (as in API resources) or its key, e.g. `product:424` or `product:my-product`.
            An unknown value returns 422 with `source.parameter` `q` and a `detail` naming the filter, the value and that an id or key is expected.
          x-qualifiers:
            - key: context_type
              type: enum
              values: ["Account","Product","Initiative","Refinement","WorkItem","InboxItem"]
              description: "One of the listed values; several values separated by commas match any of them, `-context_type:` negates."
            - key: since
              type: date
              description: "A date (YYYY-MM-DD) on last_activity_at, with >=, >, <=, < or a range `from..to`."
            - key: until
              type: date
              description: "A date (YYYY-MM-DD) on last_activity_at, with >=, >, <=, < or a range `from..to`."
            - key: sort
              type: sort
              values: ["updated-asc","updated-desc","created-asc","created-desc"]
              description: "The sort order, `<field>-asc` or `<field>-desc` (ascending when no direction is given)."
          schema:
            type: string
        - name: page[number]
          in: query
          required: false
          description: Page number, starting at 1 (default 1).
          schema:
            type: integer
        - name: page[size]
          in: query
          required: false
          description: Page size, 1 to 100 (default 25).
          schema:
            type: integer
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
        - id: run_token
          status: 200
          auth: runToken
        - id: filtered
          status: 200
          auth: apiToken
          query:
            q: "context_type:Product since:2026-10-01"
        - id: second_page
          status: 200
          auth: apiToken
          query:
            page[number]: 2
            page[size]: 1
