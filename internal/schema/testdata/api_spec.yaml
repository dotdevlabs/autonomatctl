        - id: not_granted
          status: 403
          auth: runTokenUngranted
        - id: invalid_qualifier
          status: 422
          auth: apiToken
          query: {"q": "badqualifier:x"}
        - id: invalid_page_size
          status: 422
          auth: apiToken
          query: {"page[size]": "0"}
