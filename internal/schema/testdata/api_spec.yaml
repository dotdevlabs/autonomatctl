      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
        currency:
          type: string
    CostConversionInput:
      type: object
      additionalProperties: false
      properties:
        source_amount_minor:
          type: integer
        source_currency:
          type: string
        rate:
          type: string
    OutputInputAttributes:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
        reference:
          type: string
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: Free-form result map reported by the agent; stored as sent (empty map when omitted).
    ActionInputAttributes:
      type: object
      additionalProperties: false
      description: >-
        Report the same id while running with a description before making a call, then enrich it
        with a plain-language result and amount after completion. Omitted description, result and
        amount preserve saved values. Omitted cost_pending preserves a pending price on metadata-only
        updates; a reported amount clears it unless cost_pending is explicitly true.
        Model calls count their API price for all credential types,
        including subscriptions; tool calls count reported charges or zero. Unknown model prices
        remain unavailable. Amounts must use account currency; foreign prices without explicit
        conversion evidence are retained as legacy pricing metadata, never relabeled as account currency.
        Pipeline cost classification uses schedule first, then Inbox/escalation, refinement verification
        lineage, ordinary work, and finally plan for direct planning, reconciliation, conversation
        answers and credential checks. Historical accounting uses cost_recorded_at, falling back to
        created_at, with day and month boundaries in the account time zone. Historical normalization
        is available through execution_amounts:preview and execution_amounts:apply with ACCOUNT_ID;
        it preserves stored evidence, reports unresolved prices and labels newly estimated prices.
      properties:
        operation:
          type: string
          description: The configured operation that produced this action's output.
        output:
          type: object
          description: JSON output of a configured tool. Configured external identity and URL paths populate the action reference.
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        description:
          type: string
          maxLength: 2000
          description: Purpose written before the call, in plain words.
        result:
          type: string
          maxLength: 2000
          description: Plain-language result, separate from structured outputs.
        amount:
          allOf:
            - $ref: "#/components/schemas/CallAmount"
          description: Canonical account-currency model API price or reported tool charge. Conflicting cost_actual is rejected.
        model:
          type: string
          minLength: 1
          description: Exact model name for reasoning actions, trimmed of surrounding whitespace. Must be a nonblank string when supplied. Omission preserves stored metadata.
        tokens:
          "$ref": "#/components/schemas/ReasoningTokens"
        usage_notional:
          allOf:
            - $ref: "#/components/schemas/MoneyInput"
          description: >-
            Legacy pricing evidence. For subscription model calls without a canonical amount this
            can supply the model API price when its currency matches the account. It is never added
            to amount or displayed separately. Foreign evidence is preserved for historical normalization.
        id:
          type: string
        kind:
          type: string
        target:
          type: string
        status:
          type: string
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        capability:
          type: string
          nullable: true
        tool_id:
          type: string
          nullable: true
          description: >-
            Positive decimal ID of a tool in the run's account. An invalid or unknown supplied ID refuses only
            that action, records the reason without a tool reference, and lets report processing continue.
        summary:
          type: string
          nullable: true
          description: Tool, subcommand and arguments of the call. Stored as plain text, truncated to 2000 characters.
        failure_reason:
          type: string
          nullable: true
          description: Error text, exit code with stderr, or refused subcommand. Stored as plain text, truncated to 2000 characters; a refusal decided by Autonomat takes precedence.
        cost_unit:
          type: string
          nullable: true
        cost_quantity:
          type: integer
          nullable: true
        cost_estimate:
          $ref: "#/components/schemas/MoneyInput"
        cost_actual:
          description: >-
            Compatible legacy spelling of amount. Explicit values including zero take precedence over
            estimation. For every model credential type, missing pricing uses the active account/provider/model
            API price with complete stored usage, rounded half up once per call. Saved prices survive replays
            and later price edits. Estimates in a foreign currency are retained as pricing evidence only.
          $ref: "#/components/schemas/MoneyInput"
        cost_conversion:
          $ref: "#/components/schemas/CostConversionInput"
        cost_pending:
          type: boolean
          nullable: true
        external_ref:
          $ref: "#/components/schemas/ExternalRefInput"
          nullable: true
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/OutputInputAttributes"
    CallAmount:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
        currency:
          type: string
          description: Must equal the account currency.
    ExternalRefInput:
      type: object
      additionalProperties: false
      required: [tool, kind, ref]
      description: >-
        Work the action created in a connected tool. It is stored on the action and can be looked up
        through an existing owner watch using the tool and external item ID.
        Non-empty strings for tool, kind and ref are
        required, otherwise the delivery is a 422 with a pointer to the ref.
      properties:
        tool:
          type: string
        kind:
          type: string
        ref:
          type: string
        url:
          type: string
          nullable: true
    ActionCostAttributes:
      type: object
      additionalProperties: false
      description: >-
        Either amount (or legacy cost_actual), or closed: true with neither amount nor cost_actual when the external work
        ended without a cost. A closed result records zero (or keeps an amount already recorded), stores
        the reason, sets the recorded-at time and clears cost_pending. Without amount or cost_actual and without
        closed: true the request is a 422.
      properties:
        amount:
          $ref: "#/components/schemas/CallAmount"
        cost_actual:
          allOf:
            - $ref: "#/components/schemas/MoneyInput"
          nullable: true
        closed:
          type: boolean
          description: Marks the work as closed so a missing cost_actual is accepted.
        reason:
          type: string
          nullable: true
          description: Why the closed work has no cost (only used with closed).
        cost_conversion:
          $ref: "#/components/schemas/CostConversionInput"
          nullable: true
        external_ref:
          type: string
          nullable: true
          description: "External reference identifying the source that measured this cost (e.g. a LoopControl task id)"
    ActionCostUpdateDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [action-cost]
            attributes:
              $ref: "#/components/schemas/ActionCostAttributes"
    ActionCostResultDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
    ItemOutcomeInput:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [completed, interrupted, stopped, failed]
          description: >-
            These states report execution progress and never verify the desired outcome. The responsible agent
            must explicitly PATCH its own work item to verified while its authorized run is running, with a
            description naming the actual versus desired outcome and evidence. Account tokens cannot verify work.
            Supplied invalid objects, unknown states or wrongly typed state/note values return 422 before writes.
        note:
          type: string
          nullable: true
          description: >-
            Why the work did not finish. The note cannot contain a NUL character.
            Failed, interrupted and stopped outcomes retain the note
            in failed transition metadata (trimmed to 1000 characters and scrubbed of known credentials), exposed as derived failure_reason and shown
            in the conversation ("The agent run failed: <note>", linked to the execution) and on the
            execution page. Without a note an answer run shows the generic "The agent run failed."
    CredentialRejectionInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    RunDeliveryAttributes:
      type: object
      additionalProperties: false
      required: [status, description]
      allOf:
        - oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              properties:
                status:
                  type: string
                  enum: [running]
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              required: [summary]
              properties:
                status:
                  type: string
                  enum: [succeeded, failed, cancelled, finished, completed]
      properties:
        description:
          $ref: "#/components/schemas/LifecycleDescription"
        summary:
          type: string
          minLength: 1
          pattern: '\S'
          description: Required for every terminal report. Explain the actual result, including the cause when the run fails.
        signal_ids:
          type: array
          description: Explicit signal citations used as evidence in this report. Every fact must be readable by the execution; mere browsing does not create citations.
          items: {type: string}
        tool_results:
          type: array
          description: Authenticated observations for watches in this run's node, using tools granted to the run. Duplicate delivery is idempotent. A finished tool state never certifies a product outcome.
          items:
            type: object
            additionalProperties: false
            required: [watch_id, capability_id, output]
            properties:
              watch_id:
                type: string
              capability_id:
                type: string
              output:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
              verification:
                type: object
                description: Optional observation evidence. External state and tool result metadata cannot verify a work item; only an explicit authenticated agent verification transition can.
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
        provider_conversation_id:
          type: string
          description: Provider conversation id for this answer credential; replaces a previous id. Ignored for schedule runs.
        reply_text:
          type: string
          description: Cumulative in-progress answer; retries replace the same assistant message. Ignored for schedule runs.
        failure_reason:
          type: string
          description: >-
            Provider error for a failed credential_check, with no secret material. For an ordinary failed
            schedule delivery, a nonblank failure_reason takes precedence over item_outcome.note.
        status:
          type: string
          enum: [running, succeeded, failed, cancelled, finished, completed]
          description: >-
            Progress state (`running`) or terminal state (`succeeded`, `failed`, `cancelled`). Legacy `finished` and `completed` inputs map to `succeeded`; response state is always canonical. Any other value is a 422
            with `source.pointer` `/data/attributes/status`. A delivery for a run that is already terminal is a 409.
        started_at:
          type: string
          nullable: true
          description: >-
            ISO 8601 time the agent started the run. When omitted, the earliest action start is used.
            A recorded start is never overwritten.
        finished_at:
          type: string
          nullable: true
        usage:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: >-
            Run-level usage metrics stored on the execution and returned by GET /api/executions/{id}.
            Each supplied object replaces the stored snapshot, including an empty object; omission preserves
            the previous usage. Accepted on partial and final deliveries. Null and other non-object values
            return 422 with source.pointer /data/attributes/usage.
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionInputAttributes"
        item_outcome:
          $ref: "#/components/schemas/ItemOutcomeInput"
          nullable: true
        credential_rejection:
          $ref: "#/components/schemas/CredentialRejectionInput"
          nullable: true
        answer:
          type: string
          nullable: true
          description: >-
            The reply to the operator for an answer run (a run that replies to a conversation message
            rather than doing work). Posted as one assistant message in the conversation. Also stored independently
            as result evidence for work runs, without classifying assigned-work completion. When an answer run failed
            the failure note below is shown instead. Progress reply_text is shown for API-key answers and replaced by the final answer.
            For schedule runs, an optional string answer is stored as the execution outcome only on success.
            It is ignored as schedule output on progress and on unsuccessful delivery.
        external_refs:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required: [tool, kind, ref]
            description: Recorded on the execution for lookup through existing owner watches. Terminal labels in the report never verify the work outcome.
            properties:
              tool:
                type: string
              kind:
                type: string
              ref:
                type: string
              url:
                type: string
                nullable: true
              label:
                type: string
                nullable: true
              state:
                type: string
                nullable: true
                description: >-
                  State reported by the agent. Waiting work uses the newest signal from a covering watch
                  and the tool's configured finished and failed states.
