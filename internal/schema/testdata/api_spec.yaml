paths:
  /account:
    get:
      summary: Get current account details
      operationId: getAccount
      security:
        - apiToken: []
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
        - id: unauthorized
          status: 401
          auth: invalidToken
        - id: wrong_token_kind
          status: 401
          auth: webhookTokenAsApi
      responses:
        "200":
          description: Account document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccountDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
    patch:
      summary: Update account name and worker settings
      operationId: updateAccount
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                        worker_address:
                          type: string
                          nullable: true
                        worker_ingest_token:
                          type: string
                          nullable: true
                        default_connection_id:
                          type: string
                          nullable: true
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
          body:
            data:
              attributes:
                name: Acme Corp
        - id: unauthorized
          status: 401
          auth: invalidToken
          body:
            data:
              attributes:
                name: Acme Corp
        - id: wrong_token_kind
          status: 401
          auth: webhookTokenAsApi
          body:
            data:
              attributes:
                name: Acme Corp
        - id: other_account_isolation
          status: 200
          auth: otherCorpToken
          body:
            data:
              attributes:
                name: Other Corp
        - id: validation_failure
          status: 422
          auth: apiToken
          body:
            data:
              attributes:
                name: ""
      responses:
        "200":
          description: Updated account document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccountDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Validation failed
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /health_rules:
    get:
      summary: Get the account's product health rule
      description: >
        The key metrics new products start with, the trailing window, the portfolio standard
        growth rate and the ordered state rules. All of it is account data.
      operationId: getHealthRules
      security:
        - apiToken: []
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
        - id: unauthorized
          status: 401
          auth: invalidToken
        - id: wrong_token_kind
          status: 401
          auth: webhookTokenAsApi
      responses:
        "200":
          description: Health rules document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/HealthRulesDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
    patch:
      summary: Update the account's product health rule
      description: >
        Omitted attributes are left unchanged. Lists (key_metrics, state_rules) replace the
        stored list. Invalid input returns 422 and changes nothing.
      operationId: updateHealthRules
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      properties:
                        window_days:
                          type: integer
                          minimum: 1
                          maximum: 365
                        key_metrics:
                          type: array
                          items:
                            $ref: "#/components/schemas/KeyMetric"
                        standard:
                          type: object
                          additionalProperties: false
                          properties:
                            value:
                              type: number
                            method:
                              type: string
                              enum: [fixed, statistic]
                            statistic:
                              type: string
                              enum: [mean, median, min, max]
                            min_products:
                              type: integer
                              minimum: 1
                        state_rules:
                          type: array
                          items:
