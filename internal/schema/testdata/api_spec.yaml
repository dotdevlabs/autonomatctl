    RunInboxItemUpdateDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [attributes]
          properties:
            type:
              type: string
              enum: [inbox-items]
            attributes:
              type: object
              additionalProperties: false
              x-required-by-category:
                decision: ["question","context","options","recommendation","evidence","cost_of_waiting"]
                approval: ["request","reason"]
                access: ["steps","reason","unblocks","evidence","continuation","value_request"]
                information: ["request","context","evidence","continuation","value_request"]
                review: ["request","context","evidence","continuation"]
                attestation: ["request","context","evidence","continuation"]
                external_action: ["steps","reason","unblocks","evidence","continuation","value_request"]
              description: >
                Only the given parts change; give at least one and none may be blank. An operator-owned pending
                item must keep every part the account requires of its category (`GET /inbox_requirements`);
                a missing or blank required part is a 422 with one `source.pointer` (`/data/attributes/<part>`) per part, and a value that is not a string (a text part) is a 422 pointing at that attribute. `x-required-by-category` states the default required parts per category.
              properties:
                title:
                  type: string
                question:
                  type: string
                  description: The decision to make, as one question (decision items).
                context:
                  type: string
                  description: What a person needs to know to answer or act.
                options:
                  $ref: "#/components/schemas/InboxOptions"
                steps:
                  type: string
                  description: The exact actions, systems, URLs and values (external_action and access items).
                request:
                  type: string
                reason:
                  type: string
                  description: Why a person is needed.
                unblocks:
                  type: string
                  description: What the item unblocks once it is handled.
                evidence:
                  type: string
                recommendation:
                  type: string
                  description: The key of the recommended option (decision items).
                continuation:
                  type: string
                  description: What Autonomat does after the item is resolved or marked complete, and how it checks the result.
                denial_continuation:
                  type: string
                cost_of_waiting:
                  type: string
                  description: What delay costs.
                value_request:
                  $ref: "#/components/schemas/InboxValueRequest"
