      description: >
        Files an operator-owned pending item. The parts a category must have are account data, read and
        edited with `GET`/`PATCH /inbox_requirements`; the defaults are decision: question, context, options
        (2 to 4, each with a consequence), recommendation (naming an option key), evidence, cost_of_waiting;
        external_action and access: steps, reason, unblocks, evidence, continuation (what Autonomat does after
        the item is marked complete, and how it checks the result), value_request (how a value is delivered: a typed input or an exact place); approval: request, reason; information: request, context, evidence, continuation, value_request; review and attestation: request, context, evidence, continuation. A missing or blank required part is a
        422 whose errors list every missing part, each with `source.pointer` `/data/attributes/<part>`; so is
