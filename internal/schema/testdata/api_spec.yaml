    get:
      summary: List connections
      operationId: listConnections
      security:
        - apiToken: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Typed filter query. Example: `kind:github state:verified since:2026-10-01 sort:name-asc`. Removed connections are not listed.
            Unknown qualifiers or values return 422.
          x-qualifiers:
            - key: kind
              type: enum
              values: ["github","sentry","loopcontrol","clustercontrol","terraform_cloud","kubernetes","loki","grafana","billingcontrol","model"]
              description: "One of the listed values; several values separated by commas match any of them, `-kind:` negates."
            - key: state
              type: enum
              values: ["saved","checking","verified","failed","not_live","removed"]
              description: "One of the listed values; several values separated by commas match any of them, `-state:` negates."
            - key: since
              type: date
              description: "A date (YYYY-MM-DD) on updated_at, with >=, >, <=, < or a range `from..to`."
            - key: sort
              type: sort
              values: ["name-asc","name-desc"]
              description: "The sort order, `<field>-asc` or `<field>-desc` (ascending when no direction is given)."
          schema:
            type: string
        - name: "page[number]"
          in: query
          required: false
          description: Page number, starting at 1 (default 1).
          schema:
            type: integer
            minimum: 1
        - name: "page[size]"
          in: query
          required: false
          description: Page size (default 25, at most 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
