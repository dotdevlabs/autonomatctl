  /executions:
    get:
      summary: List executions
      operationId: listExecutions
      security:
        - apiToken: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Filter query with typed qualifiers. Example: `schedule_run:12 step:2 state:finished`.
            The qualifiers are listed in `x-qualifiers`; `step:` is 1-based, as shown to agents, and accepts comparisons and ranges such as `step:1..3`; `node:` takes a node key such as `root`, `product:alpha` or `initiative:launch`. Prefix a qualifier with `-` to negate it; comma-separated values are alternatives.
            Unknown qualifiers and invalid values return 422 with `source.parameter` `q`.
            A run token reads only the executions of its own node; the root run reads all of the account's executions.
          x-qualifiers:
            - key: schedule_run
              type: number
              description: "An integer on schedule_run_id, with >=, >, <=, < or a range `from..to`."
            - key: step
              type: number
              description: "An integer on step_index, with >=, >, <=, < or a range `from..to`."
            - key: node
              type: enum
              description: "One of the listed values; several values separated by commas match any of them, `-node:` negates."
            - key: state
              type: enum
              values: ["queued","sent","running","finished","completed","failed"]
              description: "One of the listed values; several values separated by commas match any of them, `-state:` negates."
            - key: kind
              type: enum
              description: "One of the listed values; several values separated by commas match any of them, `-kind:` negates."
            - key: since
              type: date
              description: "A date (YYYY-MM-DD) on created_at, with >=, >, <=, < or a range `from..to`."
            - key: sort
              type: sort
              values: ["created-asc","created-desc","started-asc","started-desc"]
              description: "The sort order, `<field>-asc` or `<field>-desc` (ascending when no direction is given)."
          schema:
            type: string
        - name: "page[number]"
          in: query
          required: false
          description: Page number, starting at 1 (default 1).
          schema:
            type: integer
            minimum: 1
        - name: "page[size]"
          in: query
          required: false
          description: Items per page, 1 to 100 (default 25).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
        - id: run_token
          status: 200
          auth: runToken
        - id: unauthorized
          status: 401
          auth: invalidToken
        - id: not_granted
          status: 403
          auth: runTokenUngranted
        - id: invalid_qualifier
          status: 422
          auth: apiToken
          query: {"q": "badqualifier:x"}
        - id: invalid_page_size
          status: 422
          auth: apiToken
          query: {"page": {"size": "0"}}
      responses:
        "200":
          description: Paginated collection
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ExecutionsDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "403":
          description: Operation not granted to the run (run token)
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Invalid query qualifier, value or page parameter
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
