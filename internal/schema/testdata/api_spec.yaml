  /products/{product_id}/documents/{document_id}/revisions:
    get:
      summary: List a product document's revisions
      operationId: listDocumentRevisions
      security:
        - apiToken: []
      parameters:
        - name: product_id
          in: path
          required: true
          description: Record id or key.
          schema:
            type: string
        - name: document_id
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: |
            Filter query supporting the typed qualifiers listed in `x-qualifiers` (each with its type, values and description).
            Unknown qualifiers or invalid values return 422.
          x-qualifiers:
            - key: state
              type: enum
              values: ["proposed","accepted","rejected"]
              description: "One of the listed values; several values separated by commas match any of them, `-state:` negates."
            - key: since
              type: date
              description: "A date (YYYY-MM-DD) on created_at, with >=, >, <=, < or a range `from..to`."
            - key: sort
              type: sort
              values: ["revision-asc","revision-desc","created-asc","created-desc"]
              description: "The sort order, `<field>-asc` or `<field>-desc` (ascending when no direction is given)."
          schema:
            type: string
        - name: page[number]
          in: query
          required: false
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
        - name: page[size]
          in: query
          required: false
          description: Page size, 1 to 100 (default 25). A value outside the range returns 422.
          schema:
            type: integer
            minimum: 1
            maximum: 100
