  /pending_calls:
    post:
      summary: Submit a tool call for operator approval instead of running it (run token)
      description: >-
        Files a pending approval Inbox item that holds the governing policy, the exact call (capability and
        arguments), the run and its node. Nothing runs. Approving the item dispatches one new execution of kind
        `approved_call` that performs exactly this call and records the result on the item; denying it never runs
        the call. Authorized by the capability named in the body: it must be granted to the run. Submitting the
        same call twice returns the same item.
      operationId: createPendingCall
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/PendingCallCreateDocument"
      x-run-capability:
        in: body
        key: capability
      x-scenarios:
        - id: granted
          status: 201
          auth: runToken
          body: {"data": {"type": "pending-calls", "attributes": {"capability": "gated-cli", "arguments": {"subcommand": "deploy", "args": ["--prod"]}, "reason": "Release approved by the roadmap"}}}
        - id: unauthorized
          status: 401
          auth: invalidToken
          body: {"data": {"type": "pending-calls", "attributes": {"capability": "gated-cli", "arguments": {"subcommand": "deploy"}, "reason": "Release"}}}
        - id: expired_token
          status: 401
          auth: expiredRunToken
          body: {"data": {"type": "pending-calls", "attributes": {"capability": "gated-cli", "arguments": {"subcommand": "deploy"}, "reason": "Release"}}}
        - id: not_granted
          status: 403
          auth: runTokenUngranted
          body: {"data": {"type": "pending-calls", "attributes": {"capability": "gated-cli", "arguments": {"subcommand": "deploy"}, "reason": "Release"}}}
        - id: account_token
          status: 403
          auth: apiToken
          body: {"data": {"type": "pending-calls", "attributes": {"capability": "gated-cli", "arguments": {"subcommand": "deploy"}, "reason": "Release"}}}
        - id: missing_capability
          status: 422
          auth: runToken
          body: {"data": {"type": "pending-calls", "attributes": {"arguments": {}, "reason": "Release"}}}
        - id: blank_reason
          status: 422
          auth: runToken
          body: {"data": {"type": "pending-calls", "attributes": {"capability": "gated-cli", "arguments": {"subcommand": "deploy"}, "reason": ""}}}
        - id: no_policy
          status: 422
          auth: runToken
          body: {"data": {"type": "pending-calls", "attributes": {"capability": "gated-cli", "arguments": {"subcommand": "status"}, "reason": "Check"}}}
        - id: malformed_json
          status: 422
          auth: runToken
          raw_body: "{not json"
      responses:
        "201":
          description: The pending call, filed as a pending approval Inbox item
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PendingCallDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "403":
          description: The capability is not granted to the run, or a run token is required
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Invalid input, a subcommand the capability does not allow, or no policy requires approval for the call
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
