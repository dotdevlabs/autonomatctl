  /pending_calls:
    post:
      summary: Submit a tool call for operator approval instead of running it (run token)
      description: >-
        For refinement and initiative work, returns the workable permission request. The initial request covers
        every matching dispatch policy and governed operation of all current work roles. Approval covers all work
        items until the workable ends. An uncovered action shares one pending extension under that same grant;
        covered actions reuse approved permission without new Inbox items. Arguments are retained in the run's
        permission-request audit, and actual tool results retain their normal execution audit. Grant approval
        resumes eligible work; it does not replay every submitted call. Workable requests do not accept replaces.
        Approval content is a title, action lines, the workable goal and the decline consequence.
        For other runs, files a pending approval Inbox item that holds the governing policy, the exact call (capability and
        arguments), the run and its node. Nothing runs. Approving the item dispatches one new execution of kind
        `approved_call` that performs exactly this call and records the result on the item; denying it never runs
        the call. Authorized by the capability named in the body: it must be granted to the run. Submitting the
        same call twice returns the same item unless it has been superseded. Calls without operation metadata
        require a one-line action `title`; metadata-derived titles remain unchanged. Optional `replaces` identifies
        a pending approval call from the same work item, or the same execution when there is no work item.
        In one transaction a fresh pending item is created and the old item is completed by the system with
        a resolution linking the replacement, retaining the old call and history without dispatching either call.
        Replacement creates a fresh item even when the arguments are unchanged. Both items must belong to the
        same account; resolved, non-call, non-approval or differently owned targets are rejected. Invalid titles
        or replacement references return 422 JSON:API errors.
      operationId: createPendingCall
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/PendingCallCreateDocument"
      x-run-capability:
        in: body
        key: capability
      responses:
        "201":
          description: The pending call, filed as a pending approval Inbox item
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/PendingCallDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "403":
          description: The capability is not granted to the run, or a run token is required
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Invalid input (including a missing metadata-free title or invalid replacement), a subcommand the capability does not allow, or no policy requires approval for the call
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
