    CapabilityInvocation:
      type: object
      description: Operator-supplied invocation settings. The listed keys are interpreted
        by the application; any other key is kept as sent.
      additionalProperties:
        "$ref": "#/components/schemas/JsonValue"
      properties:
        url:
          type: string
          description: HTTP request URL template. Placeholders are filled from the tool arguments.
        body:
          $ref: "#/components/schemas/JsonValue"
        allowed_operations:
          type: array
          items:
            type: string
        server_url:
          type: string
          description: Absolute remote MCP server URL without embedded credentials.
        transport:
          type: string
          enum: [streamable_http, sse]
        allowed_tools:
          type: array
          minItems: 1
          items:
            type: string
        command:
          type: string
        reference:
          type: string
        method:
          type: string
        operations:
          type: object
          description: 'cli: map of subcommand (an entry of allowed_commands) to the
            operationId of the API operation it calls; only commands that call this
            API are listed. A run token is granted exactly the operation ids that
            are values of this map. Replaces the removed `allowed` list.'
          additionalProperties:
            type: string
        flag_only:
          type: boolean
          description: 'cli: true when the capability is one tool defined by `allowed_flags`
            instead of `allowed_commands`; its worker tool name is the command with
            whitespace joined by underscores and characters outside A-Za-z0-9_- replaced
            by underscores. Existing name length and account collision checks apply.
            Cannot be combined with non-empty `allowed_commands` or `operations`.'
        allowed_flags:
          type: array
          minItems: 1
          description: 'cli, requires `flag_only: true`: the flags the agent may pass.
            A non-empty list; names are unique across entries, even when other fields
            differ.'
          items:
            type: object
            additionalProperties: false
            required:
            - name
            properties:
              name:
                type: string
                pattern: "^[A-Za-z0-9_-]{1,64}$"
              type:
                type: string
                enum:
                - string
                - bool
                - int
                - float64
                - stringArray
                default: string
              required:
                type: boolean
              path:
                type: boolean
                description: May only be present with type `string` (including the
                  default), even when false.
              description:
                type: string
        allowed_hosts:
          type: array
          items:
            type: string
        allowed_hosts_from:
          type: string
          enum:
          - product_live_urls
          description: "`product_live_urls`: at run-build time the allowed hosts are
            the static `allowed_hosts` plus the hosts of every active product's site-kind
            `external_refs` url in the account."
        max_body_bytes:
          type: integer
    ToolRunAccessSource:
      type: string
      enum: [token, api_url]
    ToolRunAccessReference:
      type: object
      additionalProperties: false
      required: [run_access]
      properties:
        run_access:
          $ref: "#/components/schemas/ToolRunAccessSource"
    ToolCustomHeaderScheme:
      type: string
      pattern: "^header:(?!([Hh][Oo][Ss][Tt]|[Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Ll][Ee][Nn][Gg][Tt][Hh]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]-[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn])$)[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
    ToolCredentialMapping:
      type: object
      additionalProperties: false
      description: |
        CLI uses env, with optional file delivery for named account credentials. HTTP and MCP use raw headers or auth.
        Each entry selects exactly one source. Run access is scalar. Basic auth accepts only named credentials,
        bearer accepts named credentials or the run token, and custom header auth accepts either run value or a named credential.
        Auth takes precedence over matching raw headers case-insensitively.

        The execution document preserves selectors in tool_definitions[].credential_mapping.
        Optional per-tool credentials contain resolved named values only. Immediately before each tool call, the agent
        resolves token from the run's current data.attributes.api_token.token supplied by admission and replaced on
        successful POST /runs/{run_id}/token renewal. api_url is the trusted Autonomat API base URL configured for
        admission and renewal, including its path prefix. Callback URLs, tool URLs and incoming Host headers are
        never sources for this address.

        The agent injects these values only into explicitly mapped destinations for that invocation. Unmapped tools
        receive neither value, including through inherited process environment. Missing run context, an unavailable or
        expired token after any permitted renewal, or a missing trusted API base URL fails the call requiring that
        value with a credential error. Diagnostics and tool output must never expose injected values. Existing
        invocation, allowed-host and redirect protections apply. Requests use the run token's existing permissions.
      properties:
        env:
          type: object
          description: Environment variable names must start with an ASCII letter or underscore and contain only ASCII letters, digits and underscores.
          additionalProperties:
            oneOf:
            - type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  type: string
                  minLength: 1
                as:
                  type: string
                  enum: [file]
            - $ref: "#/components/schemas/ToolRunAccessReference"
        auth:
          oneOf:
          - type: string
            enum:
            - none
          - type: object
            additionalProperties: false
            required:
            - credential
            - scheme
            properties:
              credential:
                type: string
                minLength: 1
              scheme:
                type: string
                pattern: "^(bearer|basic|header:(?!([Hh][Oo][Ss][Tt]|[Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Ll][Ee][Nn][Gg][Tt][Hh]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]-[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn])$)[!#$%&'*+.^_`|~0-9A-Za-z-]+)$"
          - type: object
            additionalProperties: false
            required: [scheme, run_access]
            properties:
              scheme:
                type: string
                enum: [bearer]
              run_access:
                type: string
                enum: [token]
          - type: object
            additionalProperties: false
            required: [scheme, run_access]
            properties:
              scheme:
                $ref: "#/components/schemas/ToolCustomHeaderScheme"
              run_access:
                $ref: "#/components/schemas/ToolRunAccessSource"
        headers:
          type: object
          description: Keys must be HTTP field names. Host, Content-Length, Transfer-Encoding and Connection are reserved regardless of case.
          additionalProperties:
            oneOf:
            - type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  type: string
                  minLength: 1
            - $ref: "#/components/schemas/ToolRunAccessReference"
    ToolWatchConfiguration:
