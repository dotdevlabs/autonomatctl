openapi: "3.0.3"
info:
  title: Autonomat API
  version: "1.2.0"
components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
    webhookToken:
      type: http
      scheme: bearer
  schemas:
    JsonValue:
      description: Any JSON value (string, number, boolean, array or object), used for free-form maps.
      nullable: true
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    BudgetLimit:
      type: object
      additionalProperties: false
      required: [level, amount_minor, currency]
      description: A daily spend limit. Reserved; the budget `limits` array is currently always empty.
      properties:
        level:
          type: string
          enum: [initiative, product, account]
        amount_minor:
          type: integer
        currency:
          type: string
    ErrorObject:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        source:
          type: object
          additionalProperties: false
          properties:
            pointer:
              type: string
        meta:
          type: object
          additionalProperties: false
          properties:
            operation_id:
              type: string
    ErrorDocument:
      type: object
      additionalProperties: false
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorObject"
    AccountAttributes:
      type: object
      additionalProperties: false
      required: [name, worker_ingest_token_configured]
      properties:
        name:
          type: string
        worker_address:
          type: string
          nullable: true
        worker_ingest_token_configured:
          type: boolean
        default_connection_id:
          type: string
          nullable: true
    AccountResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [account]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/AccountAttributes"
    AccountDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AccountResource"
    KeyMetric:
      type: object
      additionalProperties: false
      required: [key, kind, field, money]
      properties:
        key:
          type: string
          description: Metric key, lowercase letters, digits and underscores, unique in the list.
        kind:
          type: string
          description: Signal kind the readings come from (one of the signal kinds).
        field:
          type: string
          description: Field in the reading's fields holding the value.
        money:
          type: boolean
          description: True when the value is money (integer minor units plus a currency field).
    HealthStandard:
      type: object
      additionalProperties: false
      required: [value, method, statistic, min_products]
      properties:
        value:
          type: number
          description: Current portfolio standard growth rate in percent. A statistic method overwrites it daily.
        method:
          type: string
          enum: [fixed, statistic]
        statistic:
          type: string
          enum: [mean, median, min, max]
        min_products:
          type: integer
          minimum: 1
    HealthStateRule:
      type: object
      additionalProperties: false
      required: [state, when]
      properties:
        state:
          type: string
          enum: [healthy, at_risk, unhealthy, unknown]
        when:
          type: string
          enum: [any_missing, all_at_or_above, all_below, some_below]
    HealthRulesAttributes:
      type: object
      additionalProperties: false
      required: [window_days, key_metrics, standard, state_rules]
      properties:
        window_days:
          type: integer
          minimum: 1
          maximum: 365
        key_metrics:
          type: array
          items:
            $ref: "#/components/schemas/KeyMetric"
        standard:
          $ref: "#/components/schemas/HealthStandard"
        state_rules:
          type: array
          description: Evaluated in order; the first matching rule sets the state, no match means unknown.
          items:
            $ref: "#/components/schemas/HealthStateRule"
    HealthRulesResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [health-rules]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/HealthRulesAttributes"
    HealthRulesDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/HealthRulesResource"
    StatusDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/StatusResource"
    StatusResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [status]
        id:
          type: string
          enum: [current]
        attributes:
          $ref: "#/components/schemas/StatusAttributes"
    StatusAttributes:
      type: object
      additionalProperties: false
      required: [version, sha, db_version]
      properties:
        version:
          type: string
          nullable: true
        sha:
          type: string
          nullable: true
        db_version:
          type: string
          nullable: true
    WorkItemAttributes:
      type: object
      additionalProperties: false
      required: [item_type, title, source_kind, status]
      properties:
        item_type:
          type: string
        title:
          type: string
        body:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        source_kind:
          type: string
          description: >
            Origin of the item. "human" means the item was created from an operator message
            (operator message flow). "schedule" means the item was created automatically
            by schedule execution (ScheduleTickWorker processing a schedule occurrence).
        source_ref:
          type: string
          nullable: true
          description: >
            Stable reference identifying the item's origin. For schedule-sourced items
            the format is "{schedule_key}:{occurrence_date}:{step_index}:{node_key}"
            (e.g. "daily-ops:2026-09-24:0:node-alpha"). For human-sourced items the format
            is "message:{operator_message_id}".
        status:
          type: string
        dispatch_reason:
          type: string
          nullable: true
        ref:
          type: string
          nullable: true
          description: >
            Stable work reference, unique per account. Backfilled from vault_task_key
            where present; falls back to "#id" when absent.
        intake_status:
          type: string
          nullable: true
          description: >
            Processing state for human-signal items: pending, no_work, failed, or confirmed.
            Null for non-human-sourced items.
        parent_id:
          type: integer
          nullable: true
        merged_into_id:
          type: integer
          nullable: true
        connection_id:
          type: string
          nullable: true
        agent_role_id:
          type: string
          nullable: true
        product_id:
          type: integer
          nullable: true
        workable_type:
          type: string
          nullable: true
        workable_id:
          type: integer
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
    WorkItemResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [work-items]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/WorkItemAttributes"
        links:
          $ref: "#/components/schemas/ResourceLinks"
    WorkItemDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/WorkItemResource"
    WorkItemsDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemResource"
    MoneyInput:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
        currency:
          type: string
    CostConversionInput:
      type: object
      additionalProperties: false
      properties:
        source_amount_minor:
          type: integer
        source_currency:
          type: string
        rate:
          type: string
    OutputInputAttributes:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
        reference:
          type: string
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: Free-form result map reported by the agent; stored as sent (empty map when omitted).
    ActionInputAttributes:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        target:
          type: string
        status:
          type: string
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        capability:
          type: string
          nullable: true
        tool_id:
          type: string
          nullable: true
        cost_unit:
          type: string
          nullable: true
        cost_quantity:
          type: integer
          nullable: true
        cost_estimate:
          $ref: "#/components/schemas/MoneyInput"
        cost_actual:
          $ref: "#/components/schemas/MoneyInput"
        cost_conversion:
          $ref: "#/components/schemas/CostConversionInput"
        cost_pending:
          type: boolean
          nullable: true
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/OutputInputAttributes"
    ActionCostAttributes:
      type: object
      additionalProperties: false
      required: [cost_actual]
      properties:
        cost_actual:
          $ref: "#/components/schemas/MoneyInput"
        cost_conversion:
          $ref: "#/components/schemas/CostConversionInput"
          nullable: true
        external_ref:
          type: string
          nullable: true
          description: "External reference identifying the source that measured this cost (e.g. a LoopControl task id)"
    ActionCostUpdateDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [action-cost]
            attributes:
              $ref: "#/components/schemas/ActionCostAttributes"
    ActionCostResultDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
    ItemOutcomeInput:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
        note:
          type: string
          nullable: true
          description: >-
            Why the run failed. For a run whose status is not finished or completed, the note is stored
            as the execution's failure_reason (first reason wins, trimmed to 1000 characters) and shown
            in the conversation ("The agent run failed: <note>", linked to the execution) and on the
            execution page. Without a note an answer run shows the generic "The agent run failed."
    CredentialRejectionInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    RequestedActionInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [dispatch, steer, update_inbox_item, resolve_inbox_item]
          description: >-
            dispatch starts an existing work item and steer saves a steering instruction (answer runs only).
            update_inbox_item sets the reason and evidence of a pending Inbox item; resolve_inbox_item resolves a
            pending Inbox item that live evidence shows is already done. The two Inbox actions are available to any
            run kind whose role is granted the capability of the same name (a capability with interface
            `requested_action`, listed in the run payload `tool_definitions`).
        work_item_id:
          type: string
          description: "Existing work item of this account. Required for dispatch; for steer give this or initiative_id."
        initiative_id:
          type: string
          description: "Existing initiative of this account (steer only). Give exactly one of work_item_id or initiative_id."
        instruction:
          type: string
          description: "Steering instruction text (steer only, required)."
        inbox_item_id:
          type: string
          description: >-
            Pending Inbox item of this account that belongs to the run's node: its product, its initiative,
            or any item for the root (update_inbox_item and resolve_inbox_item, required).
        reason:
          type: string
          description: "Why a person is needed for the item (update_inbox_item, required). Replaces the item's reason."
        evidence:
          type: string
          description: >-
            Evidence as text with a reference to each source (required). update_inbox_item replaces the item's
            evidence; resolve_inbox_item records it on the resolution.
    RunDeliveryAttributes:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
        started_at:
          type: string
          nullable: true
          description: >-
            ISO 8601 time the agent started the run. When omitted, the earliest action start is used.
            A recorded start is never overwritten.
        finished_at:
          type: string
          nullable: true
        usage:
          type: object
          nullable: true
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: Free-form usage metrics. Accepted for backward compatibility and not stored.
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionInputAttributes"
        item_outcome:
          $ref: "#/components/schemas/ItemOutcomeInput"
          nullable: true
        credential_rejection:
          $ref: "#/components/schemas/CredentialRejectionInput"
          nullable: true
        answer:
          type: string
          nullable: true
          description: >-
            The reply to the operator for an answer run (a run that replies to a conversation message
            rather than doing work). Posted as one assistant message in the conversation. Ignored for
            runs on work items. Used only when status is finished or completed; when the run failed
            the failure note below is shown instead. Agent progress is never posted.
        requested_actions:
          type: array
          nullable: true
          maxItems: 5
          description: >-
            Actions a run asks the app to perform; honoured only for an answer or schedule run whose status
            is finished or completed, ignored otherwise. Text in `answer` never dispatches, steers or
            links anything. The app performs each action through its existing paths, records it as
            activity, appends its outcome (done, already running, or blocked with the reason) to the one
            assistant message, and links each touched work item as a work link card. A dispatch needs the
            dispatch permission of the operator who asked and passes every dispatch gate; a steer is saved
            received and becomes applied when a later run's payload is built. An invalid entry (unknown
            type, unknown or cross-account target, blank instruction) rejects the whole delivery with 422
            before anything is performed.

            update_inbox_item and resolve_inbox_item (any answer or schedule run) are performed only when the
            run's role was granted the capability of that name, the Inbox item is pending, and it belongs to
            the run's node (its product, its initiative, or any item for the root). update_inbox_item sets
            reason and evidence, keeps the previous values in the item's revision history and records an
            activity event; resolve_inbox_item resolves through the existing Inbox resolution, recording the
            evidence and the run, with an activity event. Nothing is deleted. Requested actions never fail the
            result: an invalid entry of these types, and any entry of a schedule run, is skipped and reported as
            JSON:API errors in `requested_action_errors` of the 200 response. A schedule run appends the outcomes
            to its outcome.
          items:
            $ref: "#/components/schemas/RequestedActionInput"
        external_refs:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            properties:
              tool:
                type: string
              kind:
                type: string
              ref:
                type: string
              url:
                type: string
                nullable: true
              label:
                type: string
                nullable: true
    RunDeliveryDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id, attributes]
          properties:
            type:
              type: string
              enum: [run-results]
            id:
              type: string
            attributes:
              $ref: "#/components/schemas/RunDeliveryAttributes"
    SpendTotalEntry:
      type: object
      additionalProperties: false
      required: [currency, amount_minor]
      properties:
        currency:
          type: string
        amount_minor:
          type: integer
    SpendCapabilityEntry:
      type: object
      additionalProperties: false
      required: [capability, currency, amount_minor]
      properties:
        capability:
          type: string
          nullable: true
        currency:
          type: string
        amount_minor:
          type: integer
    SpendCredentialEntry:
      type: object
      additionalProperties: false
      required: [credential_id, currency, amount_minor]
      properties:
        credential_id:
          type: string
          nullable: true
        currency:
          type: string
        amount_minor:
          type: integer
    SpendAttributes:
      type: object
      additionalProperties: false
      required: [date, totals, by_capability, by_credential]
      properties:
        date:
          type: string
        totals:
          type: array
          items:
            $ref: "#/components/schemas/SpendTotalEntry"
        by_capability:
          type: array
          items:
            $ref: "#/components/schemas/SpendCapabilityEntry"
        by_credential:
          type: array
          items:
            $ref: "#/components/schemas/SpendCredentialEntry"
    SpendResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [spend]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/SpendAttributes"
    SpendDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SpendResource"
    ExecutionAttributes:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
        agent_role_id:
          type: string
          nullable: true
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        usage:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: Free-form usage metrics reported by the agent (empty map when none).
        connection_id:
          type: string
          nullable: true
        applied_correction_ids:
          type: array
          items:
            type: integer
          default: []
        hatchet_run_id:
          type: string
          nullable: true
        requested_action_errors:
          type: array
          description: >-
            Webhook run result only: JSON:API errors (title and source pointer) for requested actions that were
            rejected and skipped. Omitted when there are none.
          items:
            type: object
            additionalProperties: false
            required: [title, source]
            properties:
              title:
                type: string
              source:
                type: object
                additionalProperties: false
                required: [pointer]
                properties:
                  pointer:
                    type: string
    ExecutionResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [executions]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/ExecutionAttributes"
    ProductAttributes:
      type: object
      additionalProperties: false
      required: [name, stage]
      properties:
        name:
          type: string
        key:
          type: string
          nullable: true
        stage:
          type: string
          enum: [development, live, sunset]
        first_dollar_in_at:
          type: string
          format: date-time
          nullable: true
    ProductDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id, attributes]
          properties:
            type:
              type: string
              enum: [products]
            id:
              type: string
            attributes:
              $ref: "#/components/schemas/ProductAttributes"
    ExecutionOutputSummary:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
        reference:
          type: string
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    ExecutionActionSummary:
      type: object
      additionalProperties: false
      required: [id, kind, status, outputs]
      properties:
        id:
          type: string
        kind:
          type: string
        target:
          type: string
          nullable: true
        status:
          type: string
        capability_id:
          type: string
          nullable: true
        failure_reason:
          type: string
          nullable: true
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionOutputSummary"
    ExecutionDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ExecutionResource"
        meta:
          type: object
          additionalProperties: false
          description: Present on GET /executions/{id}; the run's actions in id order.
          properties:
            actions:
              type: array
              items:
                $ref: "#/components/schemas/ExecutionActionSummary"
    RunResultDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id, attributes]
          properties:
            type:
              type: string
              enum: [run-results]
            id:
              type: string
            attributes:
              $ref: "#/components/schemas/ExecutionAttributes"
    RunExecutionDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id, attributes]
          properties:
            type:
              type: string
              enum: [runs]
            id:
              type: string
            attributes:
              $ref: "#/components/schemas/RunExecutionAttributes"
    RunExecutionAttributes:
      type: object
      additionalProperties: false
      required: [account, item, assignment, callback]
      properties:
        account:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        item:
          type: object
          additionalProperties: false
          required: [id, type, title, status]
          properties:
            id:
              type: string
            type:
              type: string
              description: >-
                "answer" for an answer run (a reply to a conversation message; id is the execution id,
                not a work item id). Work runs carry the work item type.
            title:
              type: string
            body:
              type: string
              nullable: true
            tags:
              type: array
              nullable: true
              items:
                type: string
            status:
              type: string
            ref:
              type: string
              nullable: true
            initiative_key:
              type: string
              nullable: true
        assignment:
          type: object
          additionalProperties: false
          required: [goal, granted_tools, rules]
          properties:
            goal:
              type: string
              description: >-
                For an answer run: the instructions, the conversation's context record and its directly
                related records, and the last 30 conversation messages as "Operator:" / "Assistant:"
                lines, each truncated to 2000 characters. Return the reply in the delivery's answer
                field. Role instructions, granted tools, rules and budget apply as for work runs.
                For a schedule run: the step's procedure, the node, the node's Autonomat context as the
                source of truth (no files or vault exist to read) and the results of earlier steps. A
                product node's context holds purpose, stage, health and revenue, accepted documents
                (each truncated to 4000 characters), initiatives with status, open and blocked work,
                open Inbox items, and recent signals and activity (lists capped at 20). A root node's
                context holds the strategy document and a summary of every product.
            role_instructions:
              type: string
            granted_tools:
              type: array
              items:
                type: string
            rules:
              type: string
            assigned_role:
              type: string
              nullable: true
            budget:
              type: object
              nullable: true
              additionalProperties: false
              required: [daily_spend, remaining, limits]
              properties:
                daily_spend:
                  type: object
                  additionalProperties: false
                  required: [amount_minor, currency]
                  properties:
                    amount_minor:
                      type: integer
                    currency:
                      type: string
                remaining:
                  type: object
                  additionalProperties: false
                  required: [amount_minor, currency]
                  properties:
                    amount_minor:
                      type: integer
                    currency:
                      type: string
                limits:
                  type: array
                  description: Reserved. Always an empty array today; the daily limits are checked by the dispatch gate.
                  items:
                    $ref: "#/components/schemas/BudgetLimit"
            applied_correction_ids:
              type: array
              items:
                type: integer
        tool_definitions:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required: [id, name, description, interface, command, allowed_commands, invocation, input_schema]
            properties:
              id:
                type: string
              name:
                type: string
                description: The capability key.
              description:
                type: string
              interface:
                type: string
                enum: [cli, http, builtin, requested_action, unknown]
                description: How the tool is invoked. `http` is a read-only GET of a URL. `requested_action` is not run by the agent; it is asked for in the result's `requested_actions` (see RunDeliveryAttributes).
              command:
                type: string
                nullable: true
                description: The CLI command for a cli tool; null otherwise.
              allowed_commands:
                type: array
                items:
                  type: string
                description: The only subcommands the agent may run (cli), `["GET"]` (http), or empty (builtin, requested_action).
              invocation:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                required: [kind]
                properties:
                  kind:
                    type: string
                    enum: [cli, http, builtin, requested_action]
                    description: Always equal to `interface`.
                  command:
                    type: string
                  reference:
                    type: string
                  method:
                    type: string
                  url:
                    type: string
                  allowed:
                    type: array
                    items:
                      type: string
                  allowed_hosts:
                    type: array
                    items:
                      type: string
                  max_body_bytes:
                    type: integer
                description: Always carries `kind` (equal to `interface`). For http, includes optional `allowed_hosts` and `max_body_bytes` (response body cap).
              input_schema:
                type: object
                additionalProperties: false
                required: [type, properties]
                properties:
                  type:
                    type: string
                    enum: [object]
                  properties:
                    type: object
                    description: One JSON Schema property per tool input, keyed by input name.
                    additionalProperties:
                      $ref: "#/components/schemas/CapabilityInputDefinition"
                description: A JSON Schema object (`type` object with a `properties` object). For cli, the `subcommand` (enum of allowed_commands) and `args`; for http, the `url`. A builtin capability is sent only when the agent contract defines it; otherwise it is left out with a run warning.
              allowed:
                type: array
                items:
                  type: string
              approval_required:
                type: boolean
                description: >-
                  True when a policy (`requires: approval`) gates calls of this tool. The agent must not run a gated
                  call; it submits the exact call with `POST /pending_calls` (operationId `createPendingCall`) and
                  an operator decides in the Inbox. Always false in an `approved_call` run.
              governing_policy:
                type: string
                nullable: true
                description: The key of the policy that gates this tool; null when `approval_required` is false.
              approval_subcommands:
                type: array
                items:
                  type: string
                description: The subcommands or operations that need approval; empty when every call of the tool does (or when not gated).
        approved_call:
          type: object
          nullable: true
          additionalProperties: false
          required: [inbox_item_id, capability, arguments]
          description: >-
            Present only in a run of kind `approved_call`, which Autonomat dispatches once when an operator approves
            a submitted call. The run performs exactly this call and nothing else, then reports the result as its
            answer; the result is recorded on the Inbox item. An approved call is never retried.
          properties:
            inbox_item_id:
              type: string
              description: The approved Inbox item (a call is executed at most once per item).
            capability:
              type: string
              description: The capability key to call.
            arguments:
              type: object
              description: The exact arguments the run submitted and the operator approved.
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
        model_credential:
          type: object
          nullable: true
          additionalProperties: false
          required: [provider, kind, secret]
          properties:
            provider:
              type: string
            kind:
              type: string
            secret:
              type: string
            expires_at:
              type: string
              nullable: true
            refresh_value:
              type: string
              nullable: true
        api_token:
          type: object
          nullable: true
          additionalProperties: false
          required: [token, expires_at]
          description: >-
            A short-lived API token bound to this run (`Authorization: Bearer <token>`). It expires at
            `expires_at` or when the run reaches a terminal state, whichever is first. The run may call only
            the operations a capability granted to its role lists by operationId (for example the allowed
            subcommands of a CLI capability), and only on records inside its node. A denied request
            returns 403 naming the operation. Each fetch of this document issues a new token and revokes the
            earlier one. Absent for a run that is already terminal.
          properties:
            token:
              type: string
            expires_at:
              type: string
              format: date-time
        callback:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url:
              type: string
