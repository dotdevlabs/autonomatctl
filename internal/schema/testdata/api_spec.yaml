openapi: "3.0.3"
info:
  title: Autonomat API
  version: "0.0.21"
  x-version-stage: development
components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
    codexCallbackToken:
      type: http
      scheme: bearer
      description: Single-authorization callback token supplied only to the agent worker.
    webhookToken:
      type: http
      scheme: bearer
    signalSignature:
      type: apiKey
      in: header
      name: X-LoopControl-Signature
      description: Example header name. Use the signature header configured on the signal source.
  schemas:
    TypedExternalId:
      type: string
      pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]*:(?![\u0009-\u000D \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]+(?![\s\S]))[^\u0000\u0009-\u000D ](?:[^\u0000]*[^\u0000\u0009-\u000D ])?(?![\s\S])'
      description: External identity in kind:id form. The identifier after the first colon is opaque and case-sensitive.
      example: task:2433
    SignalSourceSettings:
      type: object
      description: Set event_type_field to the output path containing the exact event type. Each message_mapping entry requires item and can define container and account, each with kind and field. Entries may also map event_id, state, version, observed_at, url and product_id to output paths.
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      example:
        tool: loopcontrol
        event_type_field: event_type
        message_mapping:
          task.stage_changed:
            item: {kind: task, field: task_id}
            container: {kind: project, field: project_id}
            state: new_stage
            version: stage_version
          project.created:
            item: {kind: project, field: project_id}
    SignalSourceCreateDocument:
      type: object
      description: A source receives a recurring poll when it has a configured event listing or a linked watching watch. Webhook-only sources without linked watches have no polling schedule.
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [attributes]
          properties:
            type: {type: string, enum: [signal_sources]}
            attributes:
              type: object
              additionalProperties: false
              required: [name, kind]
              properties:
                name: {type: string}
                kind: {type: string}
                summary: {type: string, nullable: true}
                reconciliation_cursor: {type: string, nullable: true}
                settings:
                  $ref: "#/components/schemas/SignalSourceSettings"
                webhook_mode: {type: string, enum: [bearer, signed], default: bearer}
                webhook_signature_header: {type: string, nullable: true}
                webhook_digest: {type: string, enum: [SHA256, SHA384, SHA512], nullable: true}
                webhook_signature_prefix: {type: string, nullable: true}
                webhook_event_id_field: {type: string, nullable: true}
                webhook_secret:
                  type: string
                  writeOnly: true
                  description: Required when enabling signed mode.
    SignalSourceInputDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [attributes]
          properties:
            type: {type: string, enum: [signal_sources]}
            attributes:
              type: object
              additionalProperties: false
              properties:
                name: {type: string}
                kind: {type: string}
                summary: {type: string, nullable: true}
                reconciliation_cursor: {type: string, nullable: true}
                settings:
                  $ref: "#/components/schemas/SignalSourceSettings"
                webhook_mode: {type: string, enum: [bearer, signed], default: bearer}
                webhook_signature_header: {type: string, nullable: true}
                webhook_digest: {type: string, enum: [SHA256, SHA384, SHA512], nullable: true}
                webhook_signature_prefix: {type: string, nullable: true}
                webhook_event_id_field: {type: string, nullable: true}
                webhook_secret:
                  type: string
                  writeOnly: true
                  description: Required when first enabling signed mode. Omission or a blank value preserves the saved secret.
    SignalSourceDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, type, attributes]
          properties:
            id: {type: string}
            type: {type: string, enum: [signal_sources]}
            attributes:
              type: object
              additionalProperties: false
              required: [name, kind, summary, state, settings, reconciliation_cursor, webhook_mode, webhook_signature_header, webhook_digest, webhook_signature_prefix, webhook_event_id_field]
              properties:
                name: {type: string}
                kind: {type: string}
                summary: {type: string, nullable: true}
                state: {type: string, enum: [active, failed, disabled]}
                settings:
                  $ref: "#/components/schemas/SignalSourceSettings"
                reconciliation_cursor: {type: string, nullable: true}
                webhook_mode: {type: string, enum: [bearer, signed]}
                webhook_signature_header: {type: string, nullable: true}
                webhook_digest: {type: string, nullable: true}
                webhook_signature_prefix: {type: string, nullable: true}
                webhook_event_id_field: {type: string, nullable: true}
    LifecycleDescription:
      type: string
      minLength: 1
      pattern: '\S'
      description: Plain-language explanation of what changed, why, and what happens next. Blank text, bare state names and reason codes are refused with 422.
    LifecycleDescriptionDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [attributes]
          properties:
            type:
              type: string
            attributes:
              type: object
              additionalProperties: false
              required: [description]
              properties:
                description:
                  $ref: "#/components/schemas/LifecycleDescription"
    JsonValue:
      description: Any JSON value (string, number, boolean, array or object), used for free-form maps.
      nullable: true
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    BudgetLimit:
      type: object
      additionalProperties: false
      required: [level, amount_minor, currency]
      description: A daily spend limit. Reserved; the budget `limits` array is currently always empty.
      properties:
        level:
          type: string
          enum: [initiative, product, account]
        amount_minor:
          type: integer
        currency:
          type: string
    ErrorObject:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          additionalProperties: false
          properties:
            pointer:
              type: string
            parameter:
              type: string
        meta:
          type: object
          additionalProperties: false
          properties:
            operation_id:
              type: string
    ErrorDocument:
      type: object
      additionalProperties: false
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorObject"
    AccountAttributes:
      type: object
      additionalProperties: false
      required: [name, worker_ingest_token_configured, work_item_status_map, conversation_answer_settings, work_item_procedure_key, external_ref_display_rules]
      properties:
        external_refs:
          type: array
          items: {$ref: "#/components/schemas/ProductExternalRef"}
        ceo_agent_id:
          type: string
          nullable: true
        cpo_agent_id:
          type: string
          nullable: true
        name:
          type: string
        worker_address:
          type: string
          nullable: true
        worker_ingest_token_configured:
          type: boolean
        default_model_credential_id:
          type: string
          nullable: true
        review_max_interval_days:
          type: integer
          minimum: 1
          default: 7
        reconcile_settings:
          $ref: "#/components/schemas/ReconcileSettings"
        reconcile_model_runs_daily_limit:
          type: integer
          minimum: 0
          default: 3
          description: Per-node daily model review cap. Zero disables future reviews, not code checks. Needs-review requests launch one narrow reconcile execution using the responsible agent, with ordinary usage accounting. Budget exhaustion defers until the next account budget day without creating Inbox work.
        work_sync_interval_minutes:
          type: integer
          minimum: 1
          description: Minutes between two checks of one followed work reference.
        work_item_status_map:
          $ref: "#/components/schemas/WorkItemStatusMap"
        conversation_answer_settings:
          $ref: "#/components/schemas/ConversationAnswerSettings"
        work_item_procedure_key:
          type: string
          description: Key of the Standard (kind procedure) whose accepted body starts every work item run's goal. Default `work-item-dispatch`.
        review_procedure_key:
          type: string
          default: review
          description: Key of the active procedure Standard whose accepted body guides daily product and account reviews.
        external_ref_display_rules:
          $ref: "#/components/schemas/ExternalRefDisplayRules"
    ExternalRefDisplayRules:
      type: object
      additionalProperties: false
      required: [rules, fallback]
      description: >-
        Account data stating how a product's external references are written in agent context. The first
        rule whose `tool` (when given) equals the reference's tool and whose `kinds` (when given) include
        its kind supplies the `template`; otherwise `fallback`. Templates must contain `{ref}` and may
        use `{tool}`, `{kind}` and `{ref}`. The url and label are always appended.
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRefDisplayRule"
        fallback:
          type: string
    ExternalRefDisplayRule:
      type: object
      additionalProperties: false
      required: [template]
      properties:
        tool:
          type: string
        kinds:
          type: array
          items:
            type: string
        template:
          type: string
    ReconcileSettings:
      type: object
      additionalProperties: false
      description: Reconcile run and signal batching data. Reads include all keys; partial API updates merge supplied keys. Tools intersect the responsible agent's role grant. Empty capability keys use the role grant.
      properties:
        procedure_key:
          type: string
          minLength: 1
          default: reconcile
        allowed_capability_keys:
          type: array
          default: []
          items:
            type: string
            minLength: 1
        signal_queue_size:
          type: integer
          minimum: 1
          default: 20
          description: Unique queued signal rows needed to request a product review; duplicate occurrences do not count.
        signal_max_age_minutes:
          type: integer
          minimum: 1
          default: 60
          description: Maximum age from ingestion before the cron requests a product review.
        signal_sample_limit:
          type: integer
          minimum: 0
          default: 3
          description: Maximum digest sample bodies, each bounded to 500 characters.
    ConversationAnswerSettings:
      type: object
      additionalProperties: false
      properties:
        allowed_capability_keys:
          type: array
          default: []
          description: Answer tools are the intersection of these capability keys and the answering role grant. Empty uses all role-granted tools; selections never expand permissions.
          items:
            type: string
            minLength: 1
        procedure_key:
          type: string
          description: Key of the accepted `procedure` Standard whose body instructs answer runs. A missing or blank procedure fails the run and posts the reason to the conversation.
        history_limit:
          type: integer
          minimum: 1
          description: Number of latest conversation messages given to an answer run; older messages are folded into the rolling conversation summary.
        message_limit:
          type: integer
          minimum: 1
          description: Characters kept of each history message.
        summary_line_limit:
          type: integer
          minimum: 1
          description: Characters kept of each message in the rolling summary.
        context_limit:
          type: integer
          minimum: 1
          default: 60000
          description: Maximum characters in answer subject context including headings and truncation notes. Supplemental sections are removed before linked records, then oversized subject fields are omitted with a note. Very small limits retain only a shortened truncation marker.
        summary_limit:
          type: integer
          minimum: 1
          description: Characters kept of the rolling summary (oldest lines dropped first; earlier summary records are kept).
      description: >-
        Account data for conversation answer runs. All keys are present on read; on update a partial object
        changes only the given keys.
    WorkItemStatusMap:
      type: object
      additionalProperties:
        type: string
      description: >-
        Account data mapping a run's `item_outcome.state` to a work item status. Exactly the keys
        `completed` (completed with no open external work, default `done`), `completed_open_external_work`
        (completed while the item has external refs, default `in_progress`), `interrupted` (default `ready`),
        `stopped` (default `ready`) and `failed` (default `ready`); each value is one of the work item statuses.
        Unfinished outcomes use only open, ready or in_progress mappings; terminal mappings fall back to ready.
        Unknown supplied outcome states return 422. Missing completion evidence keeps work open.
    AccountResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [account]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/AccountAttributes"
    AccountDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AccountResource"
    KeyMetric:
      type: object
      additionalProperties: false
      required: [key, kind, field, money]
      properties:
        key:
          type: string
          description: Metric key, lowercase letters, digits and underscores, unique in the list.
        kind:
          type: string
          description: Signal kind the readings come from (one of the signal kinds).
        field:
          type: string
          description: Field in the reading's fields holding the value.
        money:
          type: boolean
          description: True when the value is money (integer minor units plus a currency field).
    HealthStandard:
      type: object
      additionalProperties: false
      required: [value, method, statistic, min_products]
      properties:
        value:
          type: number
          description: Current portfolio standard growth rate in percent. A statistic method overwrites it daily.
        method:
          type: string
          enum: [fixed, statistic]
        statistic:
          type: string
          enum: [mean, median, min, max]
        min_products:
          type: integer
          minimum: 1
    HealthStateRule:
      type: object
      additionalProperties: false
      required: [state, when]
      properties:
        state:
          type: string
          enum: [healthy, at_risk, unhealthy, unknown]
        when:
          type: string
          enum: [any_missing, all_at_or_above, all_below, some_below]
    HealthRulesAttributes:
      type: object
      additionalProperties: false
      required: [window_days, key_metrics, standard, state_rules]
      properties:
        window_days:
          type: integer
          minimum: 1
          maximum: 365
        key_metrics:
          type: array
          items:
            $ref: "#/components/schemas/KeyMetric"
        standard:
          $ref: "#/components/schemas/HealthStandard"
        state_rules:
          type: array
          description: Evaluated in order; the first matching rule sets the state, no match means unknown.
          items:
            $ref: "#/components/schemas/HealthStateRule"
    HealthRulesResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [health-rules]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/HealthRulesAttributes"
    HealthRulesDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/HealthRulesResource"
    StatusDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/StatusResource"
    StatusResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [status]
        id:
          type: string
          enum: [current]
        attributes:
          $ref: "#/components/schemas/StatusAttributes"
    StatusAttributes:
      type: object
      additionalProperties: false
      required: [version, sha, db_version, contract_version]
      properties:
        version:
          type: string
          nullable: true
        sha:
          type: string
          nullable: true
        db_version:
          type: string
          nullable: true
        contract_version:
          type: string
          description: The info.version of the API contract this deployment serves.
    RunDependency:
      type: object
      additionalProperties: false
      required: [id, title, status, outcome, outputs]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        outcome:
          type: string
          nullable: true
        outputs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, reference, result]
            properties:
              id:
                type: string
              kind:
                type: string
              reference:
                type: string
                nullable: true
              result:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
    WorkItemOutput:
      type: object
      additionalProperties: false
      required: [id, execution_id, kind, reference, result]
      properties:
        id:
          type: string
        execution_id:
          type: string
        kind:
          type: string
        reference:
          type: string
          nullable: true
        result:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    WorkItemAttributes:
      type: object
      additionalProperties: false
      description: New and updated work requires every outcome field. Legacy records may return null until their definition is supplied; evidence is never fabricated during migration.
      required: [item_type, title, source_kind, status, product_id, workable_type, workable_id, responsible_agent_id, current_state_evidence, desired_outcome, acceptance_criteria, verification, run_count]
      properties:
        current_state_evidence:
          type: string
          nullable: true
          description: What is true now, including evidence. Distinct from the lifecycle status.
        desired_outcome:
          type: string
          nullable: true
        acceptance_criteria:
          type: string
          nullable: true
        verification:
          type: string
          nullable: true
          description: How the responsible agent verifies the actual outcome using the user's tools.
        run_count:
          type: integer
          readOnly: true
          description: Actual work executions, excluding credential checks and orchestration.
        responsible_agent_id:
          type: string
          nullable: true
        item_type:
          type: string
        title:
          type: string
        body:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        source_kind:
          type: string
          description: >
            Origin of the item. "human" means the item was created from an operator message
            (operator message flow). "run" means an execution created the item, including
            a scheduled procedure. "schedule" is retained for imported scheduled items.
        source_ref:
          type: string
          nullable: true
          description: >
            Stable reference identifying the item's origin. Run-created items use
            "run:{execution_id}". Human-sourced items use "message:{operator_message_id}".
            Imported items retain their original source reference.
        status:
          type: string
        dispatch_reason:
          type: string
          nullable: true
        next_action:
          type: string
          nullable: true
          description: What should happen next with this work item (free text, at most 2000 characters).
        outcome:
          type: string
          nullable: true
          description: >-
            Latest outcome: the answer of the item's newest finished or completed run (approved-call runs
            excluded), null when no run has reported one. Read-only.
        outputs:
          type: array
          description: >-
            Outputs (kind, reference, result) reported by the actions of every run of the item, oldest
            first. Read-only.
          items:
            $ref: "#/components/schemas/WorkItemOutput"
        ref:
          type: string
          description: >
            Stable work reference, unique per account. Backfilled from vault_task_key
            where present; falls back to "#id" when absent.
        intake_status:
          type: string
          nullable: true
          description: >
            Processing state for human-signal items: pending, no_work, failed, or confirmed.
            Null for non-human-sourced items.
        parent_id:
          type: integer
          nullable: true
        merged_into_id:
          type: integer
          nullable: true
        reconcile:
          $ref: "#/components/schemas/WorkItemReconcileMetadata"
        depends_on_ids:
          type: array
          description: >
            Ids of work items of the account this item waits on. An item is dispatched only once every one
            of them is verified; it is dispatched automatically when the last dependency is verified.
            Unknown ids, the item itself and cycles are rejected with 422.
          items:
            type: integer
        model_credential_id:
          type: string
          nullable: true
        agent_role_id:
          type: string
          nullable: true
        product_id:
          type: integer
        workable_type:
          type: string
        workable_id:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    WorkItemResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [work-items]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/WorkItemAttributes"
        links:
          $ref: "#/components/schemas/ResourceLinks"
    WorkItemDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/WorkItemResource"
    WorkItemCreateAttributes:
      type: object
      additionalProperties: false
      required: [item_type, title, description, product_id, workable_type, workable_id, responsible_agent_id, current_state_evidence, desired_outcome, acceptance_criteria, verification]
      description: >
        What a work item is created from. A work item belongs to a product and to a workable (an initiative or a
        refinement): `product_id`, `workable_type` and `workable_id` are all required. `source_kind` and `status`
        are optional for an account token (they default to `api` and `open`); a run token sets only item_type,
        title, description, body, tags, product_id, the workable, responsible_agent_id and depends_on_ids. Source and status are fixed by the run. Dependencies must be inside its authorized node.
      properties:
        current_state_evidence:
          type: string
          minLength: 1
        desired_outcome:
          type: string
          minLength: 1
        acceptance_criteria:
          type: string
          minLength: 1
        verification:
          type: string
          minLength: 1
        responsible_agent_id:
          type: string
        description:
          $ref: "#/components/schemas/LifecycleDescription"
        item_type:
          type: string
        title:
          type: string
        body:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        source_kind:
          type: string
          default: api
          description: Origin of the item. Defaults to `api`. Ignored for a run token (always `run`).
        source_ref:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, waiting, in_progress, verified, failed, cancelled]
          default: open
          description: Defaults to `open`. Ignored for a run token (always `open`). Dispatch admission alone enters `in_progress`; clients cannot set it.
        reason:
          type: string
          description: Required metadata when entering waiting; it must identify the dispatch prerequisite.
        parent_id:
          type: integer
          nullable: true
        merged_into_id:
          type: integer
          nullable: true
        reconcile:
          $ref: "#/components/schemas/WorkItemReconcileMetadata"
        depends_on_ids:
          type: array
          description: >
            Ids of work items of the account this item waits on. An item is dispatched only once every one
            of them is verified; it is dispatched automatically when the last dependency is verified.
            Unknown ids, the item itself and cycles are rejected with 422.
          items:
            type: integer
        model_credential_id:
          type: string
          nullable: true
        agent_role_id:
          type: string
          nullable: true
        product_id:
          type: integer
          description: The product (of the account) the work belongs to.
        workable_type:
          type: string
          enum: [Initiative, Refinement]
          description: The kind of record the work belongs to. Required together with `workable_id`.
        workable_id:
          type: integer
          description: The id of the initiative or refinement named by `workable_type`.
    WorkItemCreateResource:
      type: object
      additionalProperties: false
      required: [attributes]
      properties:
        type:
          type: string
          enum: [work-items]
        attributes:
          $ref: "#/components/schemas/WorkItemCreateAttributes"
    WorkItemCreateDocument:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/WorkItemCreateResource"
    WorkItemsDocument:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemResource"
        links:
          $ref: "#/components/schemas/CollectionLinks"
        meta:
          $ref: "#/components/schemas/PageMeta"
    ResourceLinkage:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string
    ProductSummaryAttributes:
      type: object
      additionalProperties: false
      required: [name, stage, health_state]
      properties:
        key:
          type: string
          nullable: true
        name:
          type: string
        stage:
          type: string
        health_state:
          type: string
    ProductSummaryResource:
      type: object
      additionalProperties: false
      required: [type, id, attributes, links]
      properties:
        type:
          type: string
          enum: [products]
        id:
          type: string
        attributes:
          $ref: "#/components/schemas/ProductSummaryAttributes"
        links:
          $ref: "#/components/schemas/ResourceLinks"
    InitiativeDocumentAttributes:
      type: object
      additionalProperties: false
