          description: Exact call approved by choosing this option. Requires an authorized
            originating run and an active, enabled, granted capability and allowed CLI
            subcommand. No governing approval policy is required. Supplied values do not
            rewrite arguments.
          properties:
            capability:
              type: string
            capability_id:
              type: integer
              readOnly: true
              description: Server-resolved capability identity; caller supplied IDs are
                ignored.
            arguments:
              type: object
              additionalProperties:
                "$ref": "#/components/schemas/JsonValue"
            reason:
              type: string
        value_request:
          "$ref": "#/components/schemas/InboxValueRequest"
    InboxValueRequest:
      type: object
      additionalProperties: false
      required: [kind, label]
      description: >
        How a value an item asks a person for is delivered. `kind: input` is a typed field on the item itself
        (`type` text, long_text, number, date, choice or url; `required`; `options` for a choice; a `format_hint`; and `use`,
        what Autonomat does with the value); the value the operator provides is stored on the resolution and
        handed to the work that continues. `kind: place` names an exact place to deliver to (`location`: screen
        and field, or external system and location) with an optional `link` (an Autonomat path or an http(s) URL);
        the operator marks the item complete, or chooses the option when this request belongs to a decision option.
        Content requests require a valid required input; a place or optional input cannot substitute for an answer.
        Secrets are never entered into an item: an input of type `secret`, or an
        input whose label, format_hint or use asks for a password, passphrase, API key, secret, token or credential,
        is a 422 pointing at `/data/attributes/value_request` for an item-level request or
        `/data/attributes/options` for an option request, and a place that asks for one must link to an Autonomat
        credential screen (`/settings/credentials` or `/settings/model_access`).
      properties:
        kind:
          type: string
          enum: [input, place]
        label:
          type: string
        type:
          type: string
          enum: [text, long_text, number, date, choice, url]
          description: >
            The type of an input. Use long_text for a brief, description, explanation, reason or any
            answer longer than a few words. It renders a four-row text area that grows with content;
            Enter inserts a line break and Cmd/Ctrl+Enter submits the form. Internal line breaks are
            preserved in the stored answer and resolution display. Text and long_text preserve the exact supplied
            content, including surrounding whitespace. Blankness is checked using a trimmed copy; no additional
            length limit is imposed.
            Use text for short single values such as a name.
        required:
          type: boolean
          default: true
        options:
          type: array
          items:
            type: string
          description: The allowed values of a choice input (at least two).
        format_hint:
          type: string
          description: The format an input expects.
        use:
          type: string
          description: What Autonomat does with the provided value.
        location:
          type: string
          description: Exactly where to deliver, for a place.
        link:
          type: string
          nullable: true
          description: An Autonomat path or an http(s) URL, for a place.
    InboxOptions:
      type: array
      description: >
        The choices of a decision, each `{key, label, consequence}` with a unique key and optional `call` and
        `value_request`. Either follow-up may appear alone or both may appear together. When the account requires
        `options` for the category it must hold 2 to 4 options, each with a consequence.
      items:
        $ref: "#/components/schemas/InboxOption"
    InboxRequestedOperation:
      type: object
      additionalProperties: false
      required: [operation_id, path_params, attributes]
      description: Concrete requested action evidence. Filing is refused with 422 and an authorized execution or delegation path when the operation is available. Execute through existing APIs and record the result; preserve all approval gates. Unknown identifiers are rejected. Capability presence alone does not establish availability.
      properties:
        operation_id:
          type: string
        path_params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    InboxItemCreateDocument:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - attributes
          properties:
            type:
              type: string
              enum:
              - inbox-items
            attributes:
              type: object
              additionalProperties: false
              required:
              - subject
              - category
              - request
              - escalation_chain
              - evidence
              - options
              - recommendation
              - prepared_result
              - unblocks
              - money_at_stake
              - automation_plan
              description: 'One validated escalation from the authenticated asking agent
                to its reporting agent. Only CEO escalations reach the operator. Every
                field and nested required value must be non-empty; narratives must differ.
                Missing fields return 422 with named field paths. At most one open escalation
                exists for the same record and normalized subject.

                '
              properties:
                subject:
                  type: string
                  pattern: "^[^\\r\\n]+\\?$"
                  description: A single-line decision question ending in a question mark.
                category:
                  type: string
                  enum:
                  - decision
                  - approval
                  - access
                  - information
                  - review
                  - attestation
                  - external_action
                escalation_chain:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required:
                    - agent_id
                    - reason
                    properties:
                      agent_id:
                        type: integer
                        description: Must be the authenticated asking agent. Later recipients
                          append themselves through the escalation endpoint.
                      reason:
                        type: string
                        minLength: 1
                    additionalProperties: false
                options:
                  type: array
                  minItems: 2
                  maxItems: 4
                  items:
                    "$ref": "#/components/schemas/InboxEscalationOption"
                request:
                  "$ref": "#/components/schemas/InboxEscalationRequest"
                unblocks:
                  type: string
                  minLength: 1
                evidence:
                  type: string
                  minLength: 1
                recommendation:
                  type: string
                  description: An offered option key.
                prepared_result:
                  type: string
                  minLength: 1
                  description: Prepared result, or an explicit explanation of why no prepared
                    result applies.
                money_at_stake:
                  "$ref": "#/components/schemas/MoneyInput"
                automation_plan:
                  "$ref": "#/components/schemas/InboxAutomationPlan"
