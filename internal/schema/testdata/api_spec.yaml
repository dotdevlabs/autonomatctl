    get:
      summary: List activity events
      operationId: listActivityEvents
      security:
        - apiToken: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Filter query supporting typed qualifiers and free text. Example: `subject:InboxItem kind:inbox_resolution product:my-product initiative:my-initiative since:2026-10-01 sort:occurred-asc`.
            Unknown qualifiers and invalid values return 422.
            A reference filter such as `product:` accepts the record's id (as in API resources) or its key, e.g. `product:424` or `product:my-product`.
            An unknown value returns 422 with `source.parameter` `q` and a `detail` naming the filter, the value and that an id or key is expected.
          x-qualifiers:
            - key: kind
              type: enum
              values: ["execution","tool_invocation","record_change","signal","inbox_resolution","document_change"]
              description: "One of the listed values; several values separated by commas match any of them, `-kind:` negates."
            - key: subject
              type: enum
              values: ["Execution","ExecutionAction","InboxItem","WorkItem","Product","Initiative","User","Refinement","DocumentRevision","Message","IncomingSignal"]
              description: "One of the listed values; several values separated by commas match any of them, `-subject:` negates."
            - key: product
              type: reference
              description: "The record id (as in API resources) or its key; `-product:` negates."
            - key: initiative
              type: reference
              description: "The record id (as in API resources) or its key; `-initiative:` negates."
            - key: since
              type: date
              description: "A date (YYYY-MM-DD) on occurred_at, with >=, >, <=, < or a range `from..to`."
            - key: until
              type: date
              description: "A date (YYYY-MM-DD) on occurred_at, with >=, >, <=, < or a range `from..to`."
            - key: sort
              type: sort
              values: ["occurred-asc","occurred-desc"]
              description: "The sort order, `<field>-asc` or `<field>-desc` (ascending when no direction is given)."
          schema:
            type: string
        - name: "page[number]"
          in: query
          required: false
          description: Page number, starting at 1 (default 1).
          schema:
            type: integer
            minimum: 1
        - name: "page[size]"
