              type: object
              description: "cli credential mapping: environment variable name to `credential` or `secret` (a field of the capability's connection), or to an object `{from, as}` with `as: file` to deliver the value as a file named by the variable. Names only; a mapping requires `connection_id`."
              additionalProperties:
                oneOf:
                  - type: string
                  - type: object
                    additionalProperties: false
                    required: [from, as]
                    properties:
                      from:
