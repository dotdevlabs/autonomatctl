paths:
  /account:
    get:
      summary: Get current account details
      operationId: getAccount
      security:
        - apiToken: []
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
        - id: unauthorized
          status: 401
          auth: invalidToken
        - id: wrong_token_kind
          status: 401
          auth: webhookTokenAsApi
      responses:
        "200":
          description: Account document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccountDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
    patch:
      summary: Update account name and worker settings
      operationId: updateAccount
      x-model: Account
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                        worker_address:
                          type: string
                          nullable: true
                        worker_ingest_token:
                          type: string
                          nullable: true
                        default_connection_id:
                          type: string
                          nullable: true
                        work_sync_interval_minutes:
                          type: integer
                          minimum: 1
                          description: Minutes between work tracker syncs (at least 1).
                        work_item_status_map:
                          $ref: "#/components/schemas/WorkItemStatusMap"
                        conversation_answer_settings:
                          $ref: "#/components/schemas/ConversationAnswerSettings"
                        work_item_procedure_key:
                          type: string
                        external_ref_display_rules:
                          $ref: "#/components/schemas/ExternalRefDisplayRules"
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
          body:
            data:
              attributes:
                name: Acme Corp
        - id: unauthorized
          status: 401
          auth: invalidToken
          body:
            data:
              attributes:
                name: Acme Corp
        - id: wrong_token_kind
          status: 401
          auth: webhookTokenAsApi
          body:
            data:
              attributes:
                name: Acme Corp
        - id: other_account_isolation
          status: 200
          auth: otherCorpToken
          body:
            data:
              attributes:
                name: Other Corp
        - id: validation_failure
          status: 422
          auth: apiToken
          body:
            data:
              attributes:
                name: ""
        - id: invalid_status_map
          status: 422
          auth: apiToken
          body:
            data:
              attributes:
                work_item_status_map:
                  completed: not-a-status
        - id: procedure_key_updated
          status: 200
          auth: apiToken
          body:
            data:
              attributes:
                work_item_procedure_key: custom-dispatch
        - id: invalid_procedure_key
          status: 422
          auth: apiToken
          body:
            data:
              attributes:
                work_item_procedure_key: ""
        - id: display_rules_updated
          status: 200
          auth: apiToken
          body:
            data:
              attributes:
                external_ref_display_rules:
                  rules:
                    - kinds: [repository]
                      template: "Repo {ref}"
                  fallback: "{tool} {kind}: {ref}"
        - id: invalid_display_rules
          status: 422
          auth: apiToken
          body:
            data:
              attributes:
                external_ref_display_rules:
                  rules: []
                  fallback: no placeholder
        - id: invalid_conversation_answer_settings
          status: 422
          auth: apiToken
          body:
            data:
              attributes:
                conversation_answer_settings:
                  history_limit: 0
      responses:
        "200":
          description: Updated account document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccountDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Validation failed
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /inbox_requirements:
    get:
      summary: Get the account's inbox requirements
      description: >
        For each inbox item category, the parts an operator-owned pending item must have. All of it is
        account data; the same document is `required_parts` on each Inbox item.
      operationId: getInboxRequirements
      security:
        - apiToken: []
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
        - id: unauthorized
          status: 401
          auth: invalidToken
        - id: wrong_token_kind
          status: 401
          auth: webhookTokenAsApi
      responses:
        "200":
          description: Inbox requirements document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/InboxRequirementsDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
    patch:
      summary: Update the account's inbox requirements
      description: >
        Omitted categories are left unchanged; a category given replaces its list of parts. An unknown
        category or part, or a list of the wrong shape, returns 422 and changes nothing. The change applies to
        the next item created or updated; no code change is involved.
      operationId: updateInboxRequirements
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      properties:
                        decision:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        approval:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        access:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        information:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        review:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        attestation:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        external_action:
                          $ref: "#/components/schemas/InboxRequiredParts"
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
          body:
            data:
              attributes:
                information: [request, evidence]
        - id: unauthorized
          status: 401
          auth: invalidToken
          body:
            data:
              attributes:
                information: [request]
        - id: unknown_part
          status: 422
          auth: apiToken
          body:
            data:
              attributes:
                information: [colour]
        - id: malformed_json
          status: 422
          auth: apiToken
          raw_body: "{not json"
      responses:
        "200":
          description: The updated inbox requirements
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/InboxRequirementsDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Unknown category or part, or invalid input
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /health_rules:
    get:
      summary: Get the account's product health rule
      description: >
        The key metrics new products start with, the trailing window, the portfolio standard
        growth rate and the ordered state rules. All of it is account data.
      operationId: getHealthRules
      security:
        - apiToken: []
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
        - id: unauthorized
          status: 401
          auth: invalidToken
        - id: wrong_token_kind
          status: 401
          auth: webhookTokenAsApi
      responses:
        "200":
          description: Health rules document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/HealthRulesDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
    patch:
      summary: Update the account's product health rule
      description: >
        Omitted attributes are left unchanged. Lists (key_metrics, state_rules) replace the
        stored list. Invalid input returns 422 and changes nothing.
      operationId: updateHealthRules
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      properties:
                        window_days:
                          type: integer
                          minimum: 1
                          maximum: 365
                        key_metrics:
                          type: array
                          items:
                            $ref: "#/components/schemas/KeyMetric"
                        standard:
                          type: object
                          additionalProperties: false
                          properties:
                            value:
                              type: number
                            method:
                              type: string
                              enum: [fixed, statistic]
                            statistic:
                              type: string
                              enum: [mean, median, min, max]
                            min_products:
                              type: integer
                              minimum: 1
                        state_rules:
                          type: array
                          items:
                            $ref: "#/components/schemas/HealthStateRule"
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
          body:
            data:
              attributes:
                window_days: 14
                standard:
                  value: 2.5
                  method: fixed
        - id: unauthorized
          status: 401
          auth: invalidToken
          body:
            data:
              attributes:
                window_days: 14
        - id: wrong_token_kind
          status: 401
          auth: webhookTokenAsApi
          body:
            data:
              attributes:
                window_days: 14
        - id: other_account_isolation
          status: 200
          auth: otherCorpToken
          body:
            data:
              attributes:
                window_days: 7
        - id: validation_failure
          status: 422
          auth: apiToken
          body:
            data:
              attributes:
                window_days: 0
      responses:
        "200":
          description: Updated health rules document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/HealthRulesDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Validation failed
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /spend:
    get:
      summary: Daily spend rollup by current node
      operationId: getSpend
      security:
        - apiToken: []
      parameters:
        - name: current_node
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
        - id: unauthorized
          status: 401
          auth: none
        - id: invalid_date
          status: 422
          auth: apiToken
          query:
            date: "not-a-date"
      responses:
        "200":
          description: Spend document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/SpendDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Invalid parameters
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /status:
    get:
      summary: Deploy status
      operationId: getStatus
      x-scenarios:
        - id: success
          status: 200
          auth: none
      responses:
        "200":
          description: Current deploy status
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/StatusDocument"
  /work_items:
    get:
      summary: List work items
      operationId: listWorkItems
      security:
        - apiToken: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Filter query supporting typed qualifiers.
            Example: `status:open product:myproduct since:2026-10-01 sort:updated-desc`
            Unknown qualifiers return 422.
            `status:` takes `open`, `closed`, `cancelled`, `queued`, `sent`, `running`, `finished` or `failed` (several values separated by commas, e.g. `status:open,failed`). Any other value, such as `blocked`, returns 422: blocked work is not a status; use `is:blocked` (work items with a pending inbox item block) and `-is:blocked`.
            A reference filter such as `product:` accepts the record's id (as in API resources) or its key, e.g. `product:424` or `product:my-product`.
            An unknown value returns 422 with `source.parameter` `q` and a `detail` naming the filter, the value and that an id or key is expected.
          x-qualifiers:
            - key: status
              type: enum
              values: ["open","closed","cancelled","queued","sent","running","finished","failed","done","in_progress","ready"]
              description: "One of the listed values; several values separated by commas match any of them, `-status:` negates."
            - key: product
              type: reference
              description: "The record id (as in API resources) or its key; `-product:` negates."
            - key: initiative
              type: reference
              description: "The record id (as in API resources) or its key; `-initiative:` negates."
            - key: is
              type: boolean
              values: ["blocked"]
              description: "`is:blocked` keeps work items blocked by a pending inbox item; `-is:blocked` keeps the others."
            - key: since
              type: date
              description: "A date (YYYY-MM-DD) on updated_at, with >=, >, <=, < or a range `from..to`."
            - key: until
              type: date
              description: "A date (YYYY-MM-DD) on updated_at, with >=, >, <=, < or a range `from..to`."
            - key: sort
              type: sort
              values: ["updated-asc","updated-desc","created-asc","created-desc"]
              description: "The sort order, `<field>-asc` or `<field>-desc` (ascending when no direction is given)."
          schema:
            type: string
        - name: "page[number]"
          in: query
          required: false
          description: Page number, starting at 1 (default 1).
          schema:
            type: integer
            minimum: 1
        - name: "page[size]"
          in: query
          required: false
          description: Items per page, 1 to 100 (default 25).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
        - id: unauthorized
          status: 401
          auth: none
        - id: invalid_qualifier
          status: 422
          auth: apiToken
          query:
            q: "badqualifier:x"
        - id: invalid_page_size
          status: 422
          auth: apiToken
          query: {"page": {"size": "0"}}
      responses:
        "200":
          description: Paginated work item collection with `links` and `meta.page`, like every other list
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/WorkItemsDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Invalid query qualifier or page parameter
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
    post:
      summary: Create a work item
      operationId: createWorkItem
      x-model: WorkItem
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: "#/components/schemas/WorkItemCreateDocument"
      x-run-targets:
        - model: Product
          in: body
          key: product_id
        - type_key: workable_type
          models: [Initiative, Refinement]
          in: body
          key: workable_id
      x-scenarios:
        - id: created
          status: 201
          auth: apiToken
          body:
            data:
              type: work-items
              attributes:
                item_type: report
                title: Contract Test Item
                source_kind: human
                status: open
                product_id: "~fixture:products:alpha_product"
                workable_type: Initiative
                workable_id: "~fixture:initiatives:acme_initiative"
        - id: run_created
          status: 201
          auth: runToken
          body: {"data": {"type": "work-items", "attributes": {"item_type": "report", "title": "Run created item", "product_id": "~fixture:products:alpha_product", "workable_type": "Initiative", "workable_id": "~fixture:initiatives:acme_initiative"}}}
        - id: unauthorized
          status: 401
          auth: none
          body:
            data:
              attributes: {}
        - id: expired_token
          status: 401
          auth: expiredRunToken
          body: {"data": {"type": "work-items", "attributes": {"item_type": "report", "title": "Run created item", "product_id": "~fixture:products:alpha_product", "workable_type": "Initiative", "workable_id": "~fixture:initiatives:acme_initiative"}}}
        - id: not_granted
          status: 403
          auth: runTokenUngranted
          body: {"data": {"type": "work-items", "attributes": {"item_type": "report", "title": "Run created item", "product_id": "~fixture:products:alpha_product", "workable_type": "Initiative", "workable_id": "~fixture:initiatives:acme_initiative"}}}
        - id: outside_node
