    ReasoningTokens:
      description: Complete token counts supplied directly on a reasoning action, not extracted from outputs or result.usage. When tokens is supplied, all three counters are required as JSON integers from 0 through 9223372036854775807; cached_input_tokens is included in input_tokens and must not exceed it. Invalid model or token metadata rejects the whole delivery with a 422 JSON:API error and a source.pointer identifying the field, before actions or the run change. Omission preserves previously stored counters.
      type: object
      additionalProperties: false
      properties:
        input_tokens:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
        cached_input_tokens:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
        output_tokens:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
      required:
      - input_tokens
      - cached_input_tokens
      - output_tokens
paths:
  /api/codex_device_authorizations/{id}:
    patch:
      summary: Update a transient Codex device authorization
      operationId: updateCodexDeviceAuthorization
      description: Expires 15 minutes after initiation. Terminal authorizations reject replay. Secrets are write-only and never returned. Verification URL is fixed by the application. All responses set Cache-Control to no-store. Malformed JSON is rejected before Rails parameter logging with a 422 error document.
      security:
        - codexCallbackToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [state, user_code]
                  properties:
                    state:
                      type: string
                      enum: [waiting]
                    user_code:
                      type: string
                      minLength: 1
                      maxLength: 128
                - type: object
                  additionalProperties: false
                  required: [state, auth_config]
                  properties:
                    state:
                      type: string
                      enum: [completed]
                    auth_config:
                      type: string
                      format: byte
                      description: Strict base64 encoding of the complete Codex auth.json document.
                - type: object
                  additionalProperties: false
                  required: [state]
                  properties:
                    state:
                      type: string
                      enum: [failed]
      responses:
        "204":
          description: State accepted; no credential data returned.
        "401":
          description: Missing or invalid callback bearer token.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "410":
          description: Authorization expired or no longer cached.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "409":
          description: Terminal authorization, removed credential or concurrent credential edit.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Malformed JSON, invalid state, code or auth document.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "503":
          description: Transient state storage unavailable.
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /account:
    get:
      summary: Get current account details
      operationId: getAccount
      security:
        - apiToken: []
      responses:
        "200":
          description: Account document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccountDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
    patch:
      summary: Update account name and worker settings
      operationId: updateAccount
      x-model: Account
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                        ceo_agent_id:
                          type: string
                          nullable: true
                        cpo_agent_id:
                          type: string
                          nullable: true
                        worker_address:
                          type: string
                          nullable: true
                        worker_ingest_token:
                          type: string
                          nullable: true
                        default_model_credential_id:
                          type: string
                          nullable: true
                        review_max_interval_days:
                          type: integer
                          minimum: 1
                          default: 7
                        reconcile_settings:
                          $ref: "#/components/schemas/ReconcileSettings"
                        reconcile_model_runs_daily_limit:
                          type: integer
                          minimum: 0
                          default: 3
                          description: Per-node daily model review cap. Zero disables future reviews, not code checks. Needs-review requests launch one narrow reconcile execution using the responsible agent, with ordinary usage accounting. Budget exhaustion defers until the next account budget day without creating Inbox work.
                        work_sync_interval_minutes:
                          type: integer
                          minimum: 1
                          description: Minutes between work tracker syncs (at least 1).
                        work_item_status_map:
                          $ref: "#/components/schemas/WorkItemStatusMap"
                        conversation_answer_settings:
                          $ref: "#/components/schemas/ConversationAnswerSettings"
                        work_item_procedure_key:
                          type: string
                        review_procedure_key:
                          type: string
                        external_ref_display_rules:
                          $ref: "#/components/schemas/ExternalRefDisplayRules"
                        external_refs:
                          type: array
                          items: {$ref: "#/components/schemas/ProductExternalRef"}
      responses:
        "200":
          description: Updated account document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/AccountDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Validation failed
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /inbox_requirements:
    get:
      summary: Get the account's inbox requirements
      description: >
        For each inbox item category, the parts an operator-owned pending item must have. All of it is
        account data; the same document is `required_parts` on each Inbox item.
      operationId: getInboxRequirements
      security:
        - apiToken: []
      responses:
        "200":
          description: Inbox requirements document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/InboxRequirementsDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
    patch:
      summary: Update the account's inbox requirements
      description: >
        Omitted categories are left unchanged; a category given replaces its list of parts. An unknown
        category or part, or a list of the wrong shape, returns 422 and changes nothing. The change applies to
        the next item created or updated; no code change is involved.
      operationId: updateInboxRequirements
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      properties:
                        decision:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        approval:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        access:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        information:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        review:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        attestation:
                          $ref: "#/components/schemas/InboxRequiredParts"
                        external_action:
                          $ref: "#/components/schemas/InboxRequiredParts"
      responses:
        "200":
          description: The updated inbox requirements
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/InboxRequirementsDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "422":
          description: Unknown category or part, or invalid input
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
  /health_rules:
    get:
      summary: Get the account's product health rule
      description: >
        The key metrics new products start with, the trailing window, the portfolio standard
        growth rate and the ordered state rules. All of it is account data.
      operationId: getHealthRules
      security:
        - apiToken: []
      responses:
        "200":
          description: Health rules document
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/HealthRulesDocument"
        "401":
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
    patch:
      summary: Update the account's product health rule
      description: >
        Omitted attributes are left unchanged. Lists (key_metrics, state_rules) replace the
        stored list. Invalid input returns 422 and changes nothing.
      operationId: updateHealthRules
      security:
        - apiToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      properties:
                        window_days:
                          type: integer
                          minimum: 1
                          maximum: 365
                        key_metrics:
                          type: array
                          items:
                            $ref: "#/components/schemas/KeyMetric"
                        standard:
                          type: object
                          additionalProperties: false
                          properties:
                            value:
                              type: number
                            method:
                              type: string
                              enum: [fixed, statistic]
                            statistic:
                              type: string
                              enum: [mean, median, min, max]
                            min_products:
                              type: integer
                              minimum: 1
                        state_rules:
                          type: array
                          items:
                            $ref: "#/components/schemas/HealthStateRule"
      responses:
        "200":
          description: Updated health rules document
          content:
