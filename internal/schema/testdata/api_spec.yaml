      security:
      - apiToken: []
      responses:
        '200':
          description: Price data
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ModelApiPricesDocument"
        '401':
          description: Request rejected
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ErrorDocument"
        '403':
          description: Request rejected
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ErrorDocument"
    post:
      operationId: createModelApiPrice
      description: Prices are integer minor units per million tokens, with no built-in rates. Provider and model_identifier (the exact model name) match after trimming surrounding whitespace, without aliases. Only one account/provider/model_identifier row may exist, including archived rows. Rates must be nonnegative integers no greater than 9223372036854775807, and currency must be one of USD, BTC, EUR, GBP, JPY, CHF, AUD or CAD. Use the credential provider and the exact model name reported by the agent; prices are not fetched automatically.
      summary: Create a model API price
      security:
      - apiToken: []
      x-model: ModelApiPrice
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              additionalProperties: false
              properties:
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    attributes:
                      type: object
                      additionalProperties: false
                      properties:
                        provider:
                          type: string
                          minLength: 1
                        model_identifier:
                          type: string
                          minLength: 1
                        currency:
                          type: string
                          enum:
                          - USD
                          - BTC
                          - EUR
                          - GBP
                          - JPY
                          - CHF
                          - AUD
                          - CAD
                        input_price_minor_per_million:
                          type: integer
                          minimum: 0
                          maximum: 9223372036854775807
                        cached_input_price_minor_per_million:
                          type: integer
                          minimum: 0
                          maximum: 9223372036854775807
                        output_price_minor_per_million:
                          type: integer
                          minimum: 0
                          maximum: 9223372036854775807
                        archived_at:
                          type: string
                          nullable: true
                          format: date-time
                      required:
                      - provider
                      - model_identifier
                      - currency
                      - input_price_minor_per_million
                      - cached_input_price_minor_per_million
                      - output_price_minor_per_million
                  required:
                  - attributes
              required:
              - data
      responses:
        '201':
          description: Price data
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ModelApiPriceDocument"
        '401':
          description: Request rejected
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ErrorDocument"
        '403':
          description: Request rejected
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ErrorDocument"
        '422':
          description: Request rejected
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ErrorDocument"
