    RunExecutionAttributes:
      type: object
      additionalProperties: false
      required: [account, item, assignment, callback]
      properties:
        account:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        item:
          type: object
          additionalProperties: false
          required: [id, type, title, status]
          properties:
            id:
              type: string
            type:
              type: string
              description: >-
                "answer" for an answer run (a reply to a conversation message; id is the execution id,
                not a work item id). Work runs carry the work item type.
            title:
              type: string
            body:
              type: string
              nullable: true
            tags:
              type: array
              nullable: true
              items:
                type: string
            status:
              type: string
            ref:
              type: string
              nullable: true
            initiative_key:
              type: string
              nullable: true
            dependencies:
              type: array
              description: >-
                Present when the work item depends on others (`depends_on_ids`): for each dependency its id,
                ref, title, status, final outcome and outputs.
              items:
                $ref: "#/components/schemas/RunDependency"
        assignment:
          type: object
          additionalProperties: false
          required: [goal, granted_tools, rules]
          properties:
            goal:
              type: string
              description: >-
                For an answer run: the accepted body of the account's conversation procedure (a Standard of
                kind `procedure`, key from the account's `conversation_answer_settings.procedure_key`),
                which tells the agent to act with its granted tools; the conversation's context record and
                its directly related records; the rolling summary of earlier messages when the conversation
                is longer than the history window; and the last `history_limit` conversation messages as
                "Operator:" / "Assistant:" lines, each truncated to `message_limit` characters (both
                account data). While an answer run is active, follow-up operator messages are delivered
                into it (see `listOperatorMessages`). Return the reply in the delivery's answer field. Role instructions, granted tools, rules and budget apply as for work runs.
                For a schedule run: the step's procedure, the node, the node's Autonomat context as the
                source of truth (no files or vault exist to read) and the results of earlier steps. A
                product node's context holds purpose, stage, health and revenue, accepted documents
                (each truncated to 4000 characters), initiatives with status, open and blocked work,
                open Inbox items, and recent signals and activity (lists capped at 20). A root node's
                context holds the strategy document and a summary of every product.
            role_instructions:
              type: string
            granted_tools:
              type: array
              items:
                type: string
            rules:
              type: string
            assigned_role:
              type: string
              nullable: true
            limits:
              type: object
              additionalProperties: false
              required: [timeout_ms]
              description: >-
                Limits of the run, from the role's `max_turns` and `run_timeout`. A run without a role gets the
                default timeout (7200 seconds).
              properties:
                max_turns:
                  type: integer
                  description: Most agent turns. Absent when the role states no turn limit.
                timeout_ms:
                  type: integer
                  description: Most milliseconds the run may take.
            budget:
              type: object
              nullable: true
              additionalProperties: false
              required: [daily_spend, remaining, limits]
              properties:
                daily_spend:
                  type: object
                  additionalProperties: false
                  required: [amount_minor, currency]
                  properties:
                    amount_minor:
                      type: integer
                    currency:
                      type: string
                remaining:
                  type: object
                  additionalProperties: false
                  required: [amount_minor, currency]
                  properties:
                    amount_minor:
                      type: integer
                    currency:
                      type: string
                limits:
                  type: array
                  description: Reserved. Always an empty array today; the daily limits are checked by the dispatch gate.
                  items:
                    $ref: "#/components/schemas/BudgetLimit"
            applied_correction_ids:
              type: array
              items:
                type: integer
        tool_definitions:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required: [id, name, description, interface, command, allowed_commands, invocation, input_schema]
            properties:
              id:
                type: string
              name:
                type: string
                description: The capability key.
              description:
                type: string
              interface:
                type: string
                enum: [cli, http, builtin, requested_action, unknown]
                description: How the tool is invoked. `http` is a read-only GET of a URL. `requested_action` is not run by the agent.
              command:
                type: string
                nullable: true
                description: The CLI command for a cli tool; null otherwise.
              allowed_commands:
                type: array
                items:
                  type: string
                description: The only subcommands the agent may run (cli), `["GET"]` (http), or empty (builtin, requested_action).
              invocation:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                required: [kind]
                properties:
                  kind:
                    type: string
                    enum: [cli, http, builtin, requested_action]
                    description: Always equal to `interface`.
                  command:
                    type: string
                  reference:
                    type: string
                  method:
                    type: string
                  url:
                    type: string
                  operations:
                    type: object
                    description: "cli: subcommand to the operationId of the API operation it calls (only commands that call this API)."
                    additionalProperties:
                      type: string
                  allowed_hosts:
                    type: array
                    items:
                      type: string
                  allowed_hosts_from:
                    type: string
                    enum: [product_live_urls]
                    description: "`product_live_urls`: at run-build time the allowed hosts are the static `allowed_hosts` plus the hosts of every active product's site-kind `external_refs` url in the account."
                  max_body_bytes:
                    type: integer
                  env:
                    type: object
                    description: "cli credential mapping: environment variable name to the connection field (`credential` or `secret`) whose value is in `credentials.env`, or an object `{from, as: file}` whose value is delivered as a file in `credentials.files`. Names only, never values."
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: object
                          additionalProperties: false
                          required: [from, as]
                          properties:
                            from:
                              type: string
                              enum: [credential, secret]
                            as:
                              type: string
                              enum: [file]
                  auth:
                    type: string
                    description: "http credential mapping: `none`, `bearer`, `basic` or `header:<Name>`. The resolved headers are in `credentials.headers`."
                  send_request_headers:
                    type: boolean
                    description: "http credential mapping: whether the connection's request headers are part of `credentials.headers`."
                description: "Always carries `kind` (equal to `interface`). For http, includes optional `allowed_hosts` (with `allowed_hosts_from` set to `product_live_urls` the payload carries the resolved list) and `max_body_bytes` (response body cap)."
              credentials:
                type: object
                additionalProperties: false
                description: "Write-only run payload data: the capability's connection credentials resolved through its `invocation` mapping (`env` and `files` for cli, `headers` for http). Present only for a granted capability with a mapping and an active connection holding the mapped values; a capability that cannot be resolved is left out with a run warning. Carried by this document only, never returned by any other endpoint, log, event or stored snapshot."
                properties:
                  env:
                    type: object
                    description: Environment variable name to value (cli).
                    additionalProperties:
                      type: string
                  headers:
                    type: object
                    description: HTTP header name to value (http).
                    additionalProperties:
                      type: string
                  files:
                    type: array
                    description: "File credentials (cli). The worker writes `content` to a file and sets the environment variable `name` to its path."
                    items:
                      type: object
                      additionalProperties: false
                      required: [name, content, as]
                      properties:
                        name:
                          type: string
                        content:
                          type: string
                        as:
                          type: string
                          enum: [file]
              input_schema:
                type: object
                additionalProperties: false
                required: [type, properties]
                properties:
                  type:
                    type: string
                    enum: [object]
                  properties:
                    type: object
                    description: One JSON Schema property per tool input, keyed by input name.
                    additionalProperties:
                      $ref: "#/components/schemas/CapabilityInputDefinition"
                description: A JSON Schema object (`type` object with a `properties` object). For cli, the `subcommand` (enum of allowed_commands) and `args`; for http, the `url`. A builtin capability is sent only when the agent contract defines it; otherwise it is left out with a run warning.
              allowed:
                type: array
                items:
                  type: string
              approval_required:
                type: boolean
                description: >-
                  True when a policy (`requires: approval`) gates calls of this tool. The agent must not run a gated
                  call; it submits the exact call with `POST /pending_calls` (operationId `createPendingCall`) and
                  an operator decides in the Inbox. Always false in an `approved_call` run.
              governing_policy:
                type: string
                nullable: true
                description: The key of the policy that gates this tool; null when `approval_required` is false.
              approval_subcommands:
                type: array
                items:
                  type: string
                description: The subcommands or operations that need approval; empty when every call of the tool does (or when not gated).
        approved_call:
          type: object
          nullable: true
          additionalProperties: false
          required: [inbox_item_id, capability, arguments]
          description: >-
            Present only in a run of kind `approved_call`, which Autonomat dispatches once when an operator approves
            a submitted call. The run performs exactly this call and nothing else, then reports the result as its
            answer; the result is recorded on the Inbox item. An approved call is never retried.
          properties:
            inbox_item_id:
              type: string
              description: The approved Inbox item (a call is executed at most once per item).
            capability:
              type: string
              description: The capability key to call.
            arguments:
              type: object
              description: The exact arguments the run submitted and the operator approved.
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
        model_credential:
          type: object
          nullable: true
          additionalProperties: false
          required: [provider, kind, secret]
          properties:
            provider:
              type: string
            kind:
              type: string
            secret:
              type: string
            expires_at:
              type: string
              nullable: true
            refresh_value:
              type: string
              nullable: true
        api_token:
          type: object
          nullable: true
          additionalProperties: false
          required: [token, expires_at]
          description: >-
            A short-lived API token bound to this run (`Authorization: Bearer <token>`). It expires at
            `expires_at` or when the run reaches a terminal state, whichever is first. The run may call only
            the operations a capability granted to its role lists by operationId (for example the allowed
            subcommands of a CLI capability), and only on records inside its node. A denied request
            returns 403 naming the operation. Each fetch of this document issues a new token and revokes the
            earlier one. Absent for a run that is already terminal. The token lives for the role's `run_timeout`
            plus a fixed margin (`RUN_TOKEN_MARGIN_MINUTES`, default 15 minutes); a run without a role uses
            the default timeout (7200 seconds).
          properties:
            token:
              type: string
            expires_at:
              type: string
              format: date-time
        provided_values:
          type: array
          description: >-
            Values a person provided to Inbox items that blocked this work item (the resolution of an item with a
            typed `value_request` input), oldest item first. Absent when none were provided.
          items:
            type: object
            additionalProperties: false
            required: [inbox_item_id, label, use, value]
            properties:
              inbox_item_id:
                type: string
              label:
                type: string
              type:
                type: string
                description: The input type (text, number, date, choice or url).
              use:
                type: string
                description: What Autonomat does with the value.
              value:
                type: string
        callback:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url:
              type: string
    ResourceLinks:
      type: object
      additionalProperties: false
      required: [self]
      properties:
        self:
          type: string
    RunInboxItemAttributes:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        title:
          type: string
          nullable: true
        status:
          type: string
        reason:
