    PendingCallCreateAttributes:
      type: object
      additionalProperties: false
      required: [capability, arguments, reason]
      properties:
        capability:
          type: string
          description: The capability key (required).
        arguments:
          type: object
          description: The exact arguments of the call, for a cli capability including its `subcommand` (required).
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        title:
          type: string
          description: Nonblank one-line action title, required when operation metadata is unavailable. Surrounding whitespace is trimmed; embedded line separators are rejected. A missing title returns a 422 JSON:API error stating that title is required when operation metadata is unavailable. Metadata-derived titles remain authoritative even when a title is supplied.
        replaces:
          type: string
          description: Optional pending approval call Inbox item ID in the same account and work item (including an earlier execution), or the same execution with no work item on either item. Creation and system completion of the old item are atomic; its resolution links the replacement. The old call and history are retained and neither call is dispatched. Nonexistent, malformed, resolved, non-call, non-approval or differently owned references return 422. Explicit replacement creates a fresh pending item even for unchanged arguments; ordinary submissions retain deduplication excluding superseded items.
        reason:
