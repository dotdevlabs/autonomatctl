  /initiatives:
    get:
      summary: List initiatives
      operationId: listInitiatives
      security:
        - apiToken: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            `key:<key>[,<key>...]` matches the record key exactly; several keys match any of them, e.g. `key:dispatch-quality`.
            Filter query supporting typed qualifiers. Example: `status:active product:node-product-alpha since:2026-10-01`.
            An unknown qualifier or invalid value returns 422.
            A reference filter such as `product:` accepts the record's id (as in API resources) or its key, e.g. `product:424` or `product:my-product`.
            An unknown value returns 422 with `source.parameter` `q` and a `detail` naming the filter, the value and that an id or key is expected.
          x-qualifiers:
            - key: status
              type: enum
              values: ["draft","active","concluded","abandoned"]
              description: "One of the listed values; several values separated by commas match any of them, `-status:` negates."
            - key: product
              type: reference
              description: "The record id (as in API resources) or its key; `-product:` negates."
            - key: is
              type: boolean
              values: ["paused"]
              description: "A flag filter; `-is:<value>` negates it."
            - key: since
              type: date
              description: "A date (YYYY-MM-DD) on updated_at, with >=, >, <=, < or a range `from..to`."
            - key: until
              type: date
              description: "A date (YYYY-MM-DD) on updated_at, with >=, >, <=, < or a range `from..to`."
            - key: sort
              type: sort
              values: ["title-asc","title-desc","updated-asc","updated-desc","created-asc","created-desc"]
              description: "The sort order, `<field>-asc` or `<field>-desc` (ascending when no direction is given)."
            - key: key
              type: enum
              description: "Exact key match; several keys separated by commas match any of them."
          schema:
            type: string
        - name: page[number]
          in: query
          required: false
          description: Page number, starting at 1 (default 1).
          schema:
            type: integer
        - name: page[size]
          in: query
          required: false
          description: Page size from 1 to 100 (default 25).
          schema:
            type: integer
      x-scenarios:
        - id: authorized_success
          status: 200
          auth: apiToken
        - id: filtered
