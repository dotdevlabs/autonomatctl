  /products:
    get:
      summary: List products
      operationId: listProducts
      security:
        - apiToken: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            `key:<key>[,<key>...]` matches the record key exactly; several keys match any of them, e.g. `key:dispatch-quality`.
            Filter query supporting the typed qualifiers listed in `x-qualifiers` (each with its type, values and description). Free text searches names. Example: `stage:live health:at_risk since:2026-10-01`.
            Unknown qualifiers or invalid values return 422.
          x-qualifiers:
            - key: stage
              type: enum
              values: ["development","live","sunset"]
              description: "One of the listed values; several values separated by commas match any of them, `-stage:` negates."
            - key: health
              type: enum
              values: ["healthy","at_risk","unhealthy","unknown"]
              description: "One of the listed values; several values separated by commas match any of them, `-health:` negates."
            - key: name
              type: text
              description: "Case-insensitive substring of name; several values separated by commas match any of them."
            - key: since
              type: date
              description: "A date (YYYY-MM-DD) on last_activity_at, with >=, >, <=, < or a range `from..to`."
            - key: until
              type: date
              description: "A date (YYYY-MM-DD) on last_activity_at, with >=, >, <=, < or a range `from..to`."
            - key: sort
              type: sort
              values: ["name-asc","name-desc","activity-asc","activity-desc","created-asc","created-desc"]
              description: "The sort order, `<field>-asc` or `<field>-desc` (ascending when no direction is given)."
            - key: key
              type: enum
              description: "Exact key match; several keys separated by commas match any of them."
          schema:
            type: string
        - name: page[number]
          in: query
          required: false
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
        - name: page[size]
          in: query
          required: false
          description: Page size, 1 to 100 (default 25). A value outside the range returns 422.
          schema:
            type: integer
            minimum: 1
            maximum: 100
